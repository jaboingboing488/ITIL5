terms.","exercises":[],"quizTags":["M4"],"criteria":[],"targetDate":""},{"id":"M5","title":"Four dimensions, PESTLE, lifecycle","weightPct":20,"objective":"Name the 4 dimensions, PESTLE and the 8 lifecycle activities; lifecycle is non-linear.","exercises":[],"quizTags":["M5"],"criteria":[],"targetDate":""},{"id":"M6","title":"Value streams, AI, other frameworks","weightPct":10,"objective":"Core vs enabling value streams; AI topics; DevOps and PRINCE2.","exercises":[],"quizTags":["M6"],"criteria":[],"targetDate":""},{"id":"M7","title":"Integration and simulations","weightPct":0,"objective":"Two full 40-question 60-minute simulations from different sources.","exercises":[],"quizTags":[],"criteria":[],"targetDate":""},{"id":"M8","title":"Readiness gate","weightPct":0,"objective":"Three consecutive simulations at 32/40 or higher from 2+ sources.","exercises":[],"quizTags":[],"criteria":[],"targetDate":""},{"id":"M9","title":"Exam day and retention","weightPct":0,"objective":"Warm-up, sit the exam, then keep the knowledge alive.","exercises":[],"quizTags":[],"criteria":[],"targetDate":""}],"cats":{"EX":"Exam facts","KT":"Key terms","FD":"Four dimensions","LC":"Lifecycle","VS":"Value system","VM":"Value streams","AI":"AI","FW":"Frameworks"},"lessons":[{"order":0,"optional":false,"id":"M0-Lesson-A","modules":["M0"],"title":"Module 0 Lesson A: What ITIL is, in plain words","md":"---\ntype: lesson\nproject: ITIL 5 Foundation\narea: work-career\nmodule: M0\ntags: [itil5, lesson]\nsource: Ultimate ITIL Version 5 Foundation Certification Guide, ch.1 and ch.2 (independent source), and Syllabus v5.1 structure\n---\n# Module 0 Lesson A: What ITIL is, in plain words\nHub: [[Work & Career]] · [[ITIL 5 Foundation - Charter]] · [[Book Map]]\n\nRead time: about 10 minutes. This is the starting point. You need no background.\n\n## 1. What ITIL is\n**ITIL** is a collection of good-practice guidance for running digital products and services well, so that they create real value for the people and organizations who use them. It is not a law, a piece of software or a single method. It gives people a **shared vocabulary** and a set of ideas, so teams, suppliers and customers can talk about the same things in the same way.\n\nIt began as guidance for IT departments in the UK government in the late 1980s and early 1990s, and has been updated several times since. **Version 5** is the latest edition (released in 2026). It widens the focus from \"IT services\" to **digital products and services** together, and it adds guidance on AI.\n\n**ITIL Foundation (Version 5)** is the entry-level qualification. The exam checks that you know the key words and ideas and understand how they relate. You do not need to be an expert in anything.\n\n## 2. One picture to hold on to: the restaurant\nImagine a restaurant.\n- The **kitchen** is the **service provider**. It owns the equipment, buys the food and does the work.\n- The **diner** is the **service consumer**. They want to be fed, not to run a kitchen.\n- The **meal** is what the kitchen **produces**. That is an **output**.\n- The diner being fed and happy, with time to enjoy the evening, is the **outcome**. This is the point of it all.\n- The diner does not have to shop, cook or clean. They avoid those **costs and risks**. That is what makes it a **service**.\n- The diner chooses, gives feedback and shapes what happens. The result is **co-created**: both sides contribute.\n- **Value** is how worthwhile the diner finds all of it. It depends on who is judging.\n\nAlmost everything in ITIL is a more careful version of this picture. When a later lesson feels abstract, come back to the restaurant.\n\n## 3. Words you will meet in the first lessons\n| Word | Plain meaning |\n|---|---|\n| **Organization** | A person or group with its own purpose, roles and responsibilities |\n| **Stakeholder** | Anyone who can affect, or is affected by, a service and what it achieves |\n| **Product** | A set of an organization's resources arranged to offer value to a consumer |\n| **Service** | A way of helping consumers get the outcomes they want without managing the costs and risks themselves |\n| **Digital** | Based on technology such as software, data and online platforms |\n| **Practice** | A way of doing a type of work, such as handling problems or approving changes |\n| **Framework** | A structured set of ideas and guidance that organizations adapt to their own situation |\n\n## 4. The map of what you will learn\nThe exam has seven topic areas. Their weights show where the marks are.\n| Topic | Share of the exam | Where you learn it |\n|---|---|---|\n| Key ITIL terms and definitions | 30% | Module 1 |\n| The ITIL Value System | 40% | Modules 2, 3 and 4 |\n| The four dimensions and the lifecycle | 20% (10% + 10%) | Module 5 |\n| Value streams | 5% | Module 6 |\n| ITIL and AI | 2.5% | Module 6 |\n| ITIL and other frameworks (DevOps, PRINCE2) | 2.5% | Module 6 |\n\nMore than two-thirds of the marks come from the key terms and the Value System, so those modules deserve most of your time.\n\n## 5. How to learn this well\n1. **Read a lesson** (about 12 minutes), then do its **self-check** out loud. Do not just read it twice.\n2. **Learn the cards** for that module. Each card is one word or idea.\n3. **Practice** with the Understanding practice questions. After every answer you get a one-line reason.\n4. **Repeat** for the next module. Come back to cards you missed.\n5. **Explain things in your own words.** If you can explain a term simply to a friend, you know it. If you cannot, you only recognize it.\n6. **Connect it to real life.** In the Work tab, describe something that happened at work and tag it. This is what makes the words stick.\n\nTwo common mistakes: memorizing lists without knowing what the items mean, and skipping the examples. The exam tests **recall** (do you know the term) and **understanding** (do you know what it means and how it differs from similar terms).\n\n## 6. What happens next\nYour next lesson explains exactly how the exam works and how to answer its question types. After that, Lesson 2 starts the content with Module 1.\n\n## Self-check (answer without looking)\n1. In your own words, what is ITIL?\n2. In the restaurant picture, who is the provider and who is the consumer?\n3. Is the meal an output or an outcome? What is the outcome?\n4. What makes something a service rather than just a product?\n5. Which two topics carry the most marks in the exam?\n6. Why should you explain terms in your own words?\n\n## Answers\n1. A collection of good-practice guidance for running digital products and services so they create value, with a shared vocabulary.\n2. The kitchen (and its staff) is the provider. The diner is the consumer.\n3. The meal is an output. The outcome is the diner being fed and satisfied.\n4. A service helps consumers reach the outcome they want without managing the specific costs and risks themselves.\n5. The ITIL Value System (40%) and the key ITIL terms and definitions (30%).\n6. If you can explain a term simply, you understand it. If you can only recognize it, you may not be able to answer an understanding question.\n"},{"order":2,"optional":false,"id":"M1-Lesson-A","modules":["M1"],"title":"Module 1 Lesson A: Value, outcomes and services","md":"---\ntype: lesson\nproject: ITIL 5 Foundation\narea: work-career\nmodule: M1\ntags: [itil5, lesson]\nsource: Ultimate ITIL Version 5 Foundation Certification Guide, ch.2, ch.4, Appendix A (independent source)\n---\n# Module 1 Lesson A: Value, outcomes and services\nHub: [[Work & Career]] · [[ITIL 5 Foundation - Charter]] · [[Book Map]] · [[M1]]\n\nRead time: about 12 minutes. Then do the self-check. Source: Book ch.2, ch.4, Appendix A.\n\n## 1. The big idea\nOrganizations use products and services to get **value**. Value is the perceived benefits, usefulness and importance of something, so it depends on who is judging. It is not made by the provider alone. The provider and the consumer **co-create** it: the provider supplies the capability, the consumer uses it well in their own setting.\n\nExample from work: a ticketing tool gives value only when people file and resolve tickets in it.\n\n## 2. Product, service, and their digital versions\n| Term | Plain words |\n|---|---|\n| Product | A set of an organization's resources arranged to offer value to a consumer |\n| Service | A way to enable value by helping consumers reach the outcomes they want, without the consumer having to manage the specific **costs and risks** |\n| Digital product | A product built on digital technology and design |\n| Digital service | A service that fully or largely relies on digital products |\n\nChain to remember: technology resources, then digital products, then service offerings, then digital services, then customer outcomes. A mobile banking app is the product. Making payments through it is the service.\n\n**Digital product and service management (DPSM)** is the capability of managing both together across their whole life: idea, build, run, improve.\n\n## 3. What a service offering contains\nA **service offering** is a formal description of one or more services for a target group of consumers. It is made of three things:\n- **Goods**: things handed over to the consumer, who then owns and manages them (a laptop, a licence)\n- **Access to resources**: the consumer uses something the provider keeps owning and running (cloud storage, a hosted platform)\n- **Service actions**: work the provider does, or provider and consumer do together (monitoring, support, upgrades)\n\nThe book also uses **service interactions** for what happens inside the offering. The syllabus (v5.1) lists only service offering, service actions, transfer of goods and access to resources, so learn those.\n\n## 4. Output vs outcome\n- **Output**: a deliverable that an activity or service produces. It can be tangible or intangible. It is what you made.\n- **Outcome**: the result a stakeholder gets because of one or more outputs. It is what changed for them.\n\nOnline banking: outputs are login, balance display, payments working. Outcomes are the customer managing money more easily and making better decisions.\n\nHow to tell them apart in a question: if it counts something the provider produced (incidents closed, releases shipped, uptime), it is an output. If it describes a benefit for the consumer (faster decisions, higher productivity), it is an outcome.\n\n## 5. Cost and risk\n- **Cost**: money spent on an activity or resource.\n- **Risk**: a possible event that could cause harm or loss, or make objectives harder to reach.\n\nA service moves some of both to the provider. The consumer still carries some: subscription fees, training, how the data is used. Clear agreements say who carries what. The book calls this shared responsibility, for example the provider secures the platform and the consumer manages who has access.\n\n## 6. Utility and warranty (and sustainability)\n| | Question it answers | Short form | Covers |\n|---|---|---|---|\n| **Utility** | What does it do? | Fit for purpose | The functionality that meets a need |\n| **Warranty** | How well does it perform? | Fit for use | Availability, capacity, continuity, security |\n\nA service needs both. A payment system with all the features (utility) and frequent outages (no warranty) delivers no value.\n\n**Sustainability** is assurance that the product or service keeps meeting its requirements for environmental stewardship, social progress and economic growth. In V5 it sits next to utility and warranty as something to balance.\n\n## 7. UX and CX\n- **User experience (UX)**: how a user experiences the interaction with the product or service (usability, accessibility, responsiveness).\n- **Customer experience (CX)**: the customer's overall perception across every touchpoint: portal, support, communication, reliability.\n\nUX is part of CX, and bad UX can drag CX down even when the service works.\n\n## 8. People and roles\n- **Organization**: a person or group with its own functions, responsibilities, authorities and relationships, working toward its objectives\n- **Service provider**: the organization responsible for delivering services and supporting them\n- **Service consumer**: the organization that procures and uses services\n- **Digital product vendor**: the organization that creates and continually improves digital products and related service offerings\n\nInside the consumer organization:\n| Role | Does |\n|---|---|\n| **Customer** | Defines the requirements and is responsible for the outcomes |\n| **User** | Uses the service |\n| **Sponsor** | Authorizes the budget |\n\n### The role of each organization in a service relationship\n| Organization | Its role |\n|---|---|\n| **Service provider** | Responsible for delivering services and supporting them: designs, builds, operates and maintains the products and resources that make the service possible, keeps it reliable and secure, monitors performance, and provides support. It can be internal (an IT department serving the business) or external (a third-party supplier) |\n| **Service consumer** | The organization that procures and uses the services to reach its own outcomes. It is a collective term: the customer, the user and the sponsor all sit inside the consumer organization |\n| **Digital product vendor** | Creates and continually improves digital products and related service offerings that others build services on |\n\nOne person or team can hold several roles, and an organization can be a provider to one party and a consumer of another. Example: an executive is the sponsor, a department manager the customer, and the employees the users.\n\n## 9. Types of service relationship\nLearn these three for the exam (the book defines them in Appendix A):\n| Type | Interaction level |\n|---|---|\n| **Basic** | Limited: the provider delivers, the consumer uses it, little joint activity |\n| **Cooperative** | They coordinate and share information, and work together to improve outcomes |\n| **Collaborative** | Deeper: they jointly plan, improve and co-create value |\n\nThe chapter text uses \"types\" for other things (internal, external, platform, provisioning, consumption). Do not mix those up with these three.\n\n## 10. Service journey (book-only detail)\nThe **service journey** is all the activities and interactions of the organizations in a service relationship, as each fulfils its role. The book splits it into seven stages: **Explore, Engage, Offer, Agree, Onboard, Co-create, Reflect**. The stages can overlap and loop. The seven-stage list is from the book. The syllabus (v5.1) only asks you to define the service journey, so do not memorize the seven stages for the exam.\n\n## 11. Service quality, service level and SLA\n- **Service quality**: how well a service's characteristics satisfy stated and implied needs\n- **Service level**: a set of metrics for the expected or achieved quality\n- **SLA**: a documented agreement between provider and customer naming the services and the agreed level of each. Typical content: availability target, performance, support response time, resolution time, security requirements.\n\n## Self-check (answer without looking)\n1. A report shows 120 incidents closed this month. Output or outcome?\n2. Users say the new portal is easy to use and they finish tasks faster. Which terms fit?\n3. A hosted app has every feature you need but is down every week. Which of utility and warranty is weak?\n4. Who authorizes the budget: customer, user or sponsor?\n5. The provider owns and runs a platform and you log in to use it. Which part of a service offering is this?\n6. Provider and consumer jointly plan and co-create. Which relationship type?\n7. How is UX different from CX?\n8. What does a service move off the consumer?\n9. Which organization designs, builds, operates and supports a service?\n10. Which roles make up the service consumer?\n11. What does a digital product vendor do?\n\n## Answers\n1. Output (it counts what was produced). The outcome would be less disruption for users.\n2. UX. The faster task completion is an outcome.\n3. Warranty (availability). Utility is fine.\n4. Sponsor. The customer defines requirements and owns outcomes; the user uses the service.\n5. Access to resources.\n6. Collaborative.\n7. UX is the interaction with the product or service. CX is the whole perception across every touchpoint.\n8. Specific costs and risks.\n9. The service provider.\n10. The customer, the user and the sponsor (they sit inside the consumer organization).\n11. Creates and continually improves digital products and related service offerings.\n"},{"order":90,"optional":true,"id":"M1-Lesson-B","modules":[],"title":"Module 1 Lesson B: Experience, strategy and transformation terms (optional, not examined in v5.1)","md":"---\ntype: lesson\nproject: ITIL 5 Foundation\narea: work-career\nmodule: M1\ntags: [itil5, lesson]\nsource: Ultimate ITIL Version 5 Foundation Certification Guide, ch.9 and Appendix A (independent source)\n---\n# Module 1 Lesson B: Experience, strategy and transformation terms\nHub: [[Work & Career]] · [[ITIL 5 Foundation - Charter]] · [[Book Map]] · [[M1]]\n\n> **Not examined in syllabus v5.1.** The Experience, Strategy and Transformation terms were in v5.0 and were removed in v5.1 (June 2026). This lesson is optional background. Do not spend exam time here. UX is still examined and is covered in Lesson A.\n\nRead time: about 10 minutes. Read [[M1 Lesson A - Value, outcomes and services]] first. Source: Book ch.9 (experience section), Appendix A.\n\nAn earlier syllabus version (v5.0) grouped these terms under **Experience**, **Strategy** and **Transformation**. The book defines them briefly, mostly in its Appendix A. Read them for context only.\n\n## 1. Experience terms\n| Term | Plain words |\n|---|---|\n| **Experience** (service experience) | The sum of the functional and emotional interactions with a service and its provider, as perceived by a stakeholder |\n| **Digital experience** | How a service is perceived when the interaction happens through digital technology: apps, platforms, interfaces |\n| **Trust** | Confidence that a service will deliver the expected outcomes reliably and protect stakeholders' interests |\n| **User experience (UX)** | The usability, accessibility and quality of interaction when a user engages with a service |\n| **Customer experience (CX)** | The customer's overall perception, built across all interactions with the provider |\n| **Experience level agreement (XLA)** | An agreement about the experience stakeholders expect or perceive. It goes beyond the SLA by measuring perception and satisfaction, not just technical performance |\n| **Human-centred design** | A practical approach where designers build solutions around the needs of the people who use them while meeting organizational needs |\n\nHow they connect (book):\n- Trust comes from **utility** (what it does) and **warranty** (how it performs), reinforced by governance and service quality.\n- UX and human-centred design rest on **design thinking**, a human-centred approach to designing solutions.\n- XLA extends the SLA and fits continual improvement through feedback loops.\n\nExample of SLA vs XLA: an SLA measures incident resolution time. An XLA also measures how satisfied the user was with how the incident was handled.\n\nThe shift ITIL 5 stresses: from measuring outputs to outcomes and perception; from technology-centred to human-centred design; from service efficiency to service excellence and trust.\n\nA **service journey** is not the same as a process flow. A process flow shows how the provider does the work internally. A service journey shows how the service is experienced by the stakeholder, which can reveal delays and repeated hand-offs a provider might not notice.\n\n## 2. Strategy terms\n| Term | Plain words |\n|---|---|\n| **Strategy** (in ITIL) | The approach an organization adopts to achieve its goals through chosen actions and use of resources |\n| **Business strategy** | The direction and approach used to achieve business objectives |\n| **Digital strategy** | How the organization uses digital technology and capabilities to achieve goals and create value |\n| **Mission** | A short but complete description of the organization's overall purpose and intentions |\n| **Vision** | A defined aspiration of what the organization would like to become in the future |\n| **Purpose** | Why the organization exists (what it does and for whom). The operating model translates it into execution |\n| **VUCA** | Volatility, uncertainty, complexity and ambiguity in the organization's environment |\n| **Leadership** | The ability to guide, influence and enable people to achieve shared objectives |\n\nQuick separation:\n- **Mission** is about the present purpose; **vision** is the future aspiration.\n- **Business strategy** is the overall approach; **digital strategy** is how digital capability serves it.\n- **VUCA** describes the environment: it is four words, in order V, U, C, A.\n\n## 3. Transformation terms\n| Term | Plain words |\n|---|---|\n| **Change** | The addition, modification or removal of anything that could directly or indirectly affect products and services |\n| **Transformation** | A significant organizational change that alters how the organization works, delivers or creates value |\n| **Business as usual (BAU)** | The normal, ongoing operation of the organization or of a product, service or activity |\n| **Digital transformation** | Strategic adoption of digital technology across the organization, fundamentally changing how it operates and creates value |\n\nHierarchy to remember: a **change** is any alteration; a **transformation** is a big one that changes how you work or create value; **BAU** is the steady state you return to or run alongside it.\n\n## 4. Benefits of ITIL (by audience)\n| Audience | Benefit |\n|---|---|\n| Enterprises | Alignment, governance and value creation |\n| Managed service providers | Consistent and measurable service delivery |\n| Digital product vendors | Creating and continually improving digital products and related services |\n| Professionals | Capability development, certification and applying DPSM |\n\n## 5. Mix-ups to avoid\n| Looks like | Actually |\n|---|---|\n| UX vs CX | UX is the interaction with a product or service; CX is the overall perception across all interactions |\n| SLA vs XLA | SLA = agreed service levels; XLA = agreed experience outcomes |\n| Mission vs vision | Mission = purpose now; vision = aspiration for the future |\n| Change vs transformation | Transformation is a significant change in how the organization works or creates value |\n| Experience vs digital experience | Digital experience is the digital-channel version |\n\n## Self-check (answer without looking)\n1. Define experience in ITIL terms.\n2. What does trust come from?\n3. How does an XLA differ from an SLA?\n4. What does human-centred design put at the core?\n5. Mission or vision: which is the future aspiration?\n6. What do the four letters of VUCA stand for?\n7. Change vs transformation: which is a significant shift in how the organization works?\n8. Who benefits from ITIL as \"capability development and certification\"?\n\n## Answers\n1. The sum of the functional and emotional interactions with a service and provider, as perceived by a stakeholder.\n2. Utility and warranty, reinforced by governance and service quality.\n3. An SLA covers the agreed service levels; an XLA covers the experience stakeholders expect or perceive, including satisfaction.\n4. Users and stakeholders and their real needs.\n5. Vision.\n6. Volatility, uncertainty, complexity, ambiguity.\n7. Transformation.\n8. Professionals.\n"},{"order":3,"optional":false,"id":"M2-Lesson-A","modules":["M2"],"title":"Module 2 Lesson A: The value system and the guiding principles","md":"---\ntype: lesson\nproject: ITIL 5 Foundation\narea: work-career\nmodule: M2\ntags: [itil5, lesson]\nsource: Ultimate ITIL Version 5 Foundation Certification Guide, ch.6 and Appendix A (independent source)\n---\n# Module 2 Lesson A: The value system and the guiding principles\nHub: [[Work & Career]] · [[ITIL 5 Foundation - Charter]] · [[Book Map]] · [[M2]] · [[M3]]\n\nRead time: about 12 minutes. Source: Book ch.6, Appendix A.\n\n## 1. What the ITIL Value System does\nThe **ITIL Value System** is the overall model for how an organization turns **demand and opportunities** into **value**.\n- **Demand**: a need or desire for products or services (a request, a requirement, a compliance rule).\n- **Opportunity**: a chance to improve or innovate before anyone has asked (new technology, a pattern in service data).\n- **Value**: what comes out the other end for stakeholders.\n\nDemand and opportunities are repeating inputs, not one-off events, so value creation is continuous.\n\n## 2. The five components\n| Component | One-line role |\n|---|---|\n| **Guiding principles** | Recommendations that steer decisions and behaviour in any situation |\n| **Governance** | Direction, oversight and accountability |\n| **Value chain** | The operating model of activities that turn demand into value |\n| **Management practices** | The organizational capabilities needed to do the work |\n| **Continual improvement** | Keeping services and practices improving |\n\nThey work as one system. Principles shape decisions, governance sets direction, the value chain organizes the activities, practices supply the capability, and improvement keeps it all moving.\n\nRemember it as: **P**rinciples, **G**overnance, **V**alue chain, **P**ractices, **C**ontinual improvement.\n\n## 3. Governance\n**Governance** is the system by which an organization is directed and controlled. Governance directs; management carries out.\n\nThe governing body does four things:\n| Activity | Meaning |\n|---|---|\n| **Engage stakeholders** | Find out needs, clarify commitments, agree accountability |\n| **Evaluate** | Review the organization, its strategy, portfolios and relationships as circumstances change |\n| **Direct** | Assign responsibility, set strategy and policies |\n| **Monitor** | Check performance against policies and direction |\n\nIn V5, governance also covers responsible technology use: data protection, security and ethical use of AI. (The four governance activities are from the book; the syllabus only lists governance as a component.)\n\n## 4. The value chain\nThe **value chain** is the set of activities that enables value through a product or service. Activities are combined into **value streams**: the specific workflows that deliver a particular product or service. The same value chain can produce different value streams. Resolving a major incident and launching a new product use the chain differently.\n\nIn V5 the value chain ties closely to the eight lifecycle activities (see Module 5).\n\n## 5. Management practices\nA **management practice** is an organizational capability for doing a type of work: incident management, change enablement, service desk, supplier management, information security.\n- Two groups: **product and service management practices** and **general management practices**.\n- The book counts 22 in the first group and 12 in the second (34 in total). That count is book-only.\n\n## 6. Continual improvement\nImprovement is a recurring activity at every level so the organization keeps meeting stakeholders' expectations. It uses feedback, metrics and performance data. It runs through the lifecycle activities, value streams and practices instead of being a separate project. The ITIL Continual Improvement Model is the method (covered in Module 3 Lesson B).\n\n## 7. The seven guiding principles\nLearn all seven, in this order.\n\n| # | Principle | In plain words | Work example |\n|---|---|---|---|\n| 1 | **Focus on value** | Everything should link to value for stakeholders | Ask who uses the report and what decision it supports |\n| 2 | **Start where you are** | Assess what exists before replacing it; reuse what works | Check which existing ticket categories work before redesigning all of them |\n| 3 | **Progress iteratively with feedback** | Small steps, gather feedback, adjust | Pilot a change with one team first |\n| 4 | **Collaborate and promote visibility** | Work across teams and share information openly | A shared dashboard instead of private spreadsheets |\n| 5 | **Think and work holistically** | Consider the whole system: the four dimensions | A new tool also needs skills, suppliers and workflow changes |\n| 6 | **Keep it simple and practical** | Remove unnecessary steps; avoid over-engineering | Cut approval steps that add delay but no control |\n| 7 | **Optimize and automate** | Improve the process first, then automate it | Fix the request flow before building the automation |\n\nPoints the book stresses:\n- The principles are **universal**. They apply to any organization and any situation.\n- Use them **together**, not one at a time or in sequence.\n- **Optimize before you automate.** Automating a bad process just makes it faster.\n- Principle 5 links to the **four dimensions**: organizations and people, information and technology, partners and suppliers, value streams and processes.\n- Principle 3 links to Agile and DevOps ways of working.\n\n## 8. Mix-ups to avoid\n| Looks like | Actually |\n|---|---|\n| \"Collaborate\" alone | It is \"collaborate **and promote visibility**\" |\n| \"Progress iteratively\" alone | It is \"progress iteratively **with feedback**\" |\n| \"Optimize\" and \"automate\" order | Optimize first, then automate |\n| Governance vs management | Governance directs and oversees; management does the work |\n| Value chain vs value stream | The chain is the generic set of activities; a stream is one specific workflow built from them |\n\n## Self-check (answer without looking)\n1. Name the five components of the value system.\n2. Which component directs and oversees, and which carries out the work?\n3. Name the four governance activities.\n4. Demand vs opportunity: which one has not yet been asked for?\n5. List the seven guiding principles in order.\n6. A team wants to automate a slow approval flow. Which principle says what to do first?\n7. A new tool needs training, supplier changes and new workflows. Which principle is this?\n8. Which two groups are management practices split into?\n\n## Answers\n1. Guiding principles, governance, value chain, management practices, continual improvement.\n2. Governance directs and oversees; management practices and the value chain do the work.\n3. Engage stakeholders, evaluate, direct, monitor.\n4. Opportunity. Demand is already expressed.\n5. Focus on value; start where you are; progress iteratively with feedback; collaborate and promote visibility; think and work holistically; keep it simple and practical; optimize and automate.\n6. Optimize and automate (optimize first). Keep it simple and practical also applies.\n7. Think and work holistically.\n8. Product and service management practices; general management practices.\n"},{"order":5,"optional":false,"id":"M3-Lesson-B","modules":["M3"],"title":"Module 3 Lesson B: Product and service terms","md":"---\ntype: lesson\nproject: ITIL 5 Foundation\narea: work-career\nmodule: M3\ntags: [itil5, lesson]\nsource: Ultimate ITIL Version 5 Foundation Certification Guide, ch.5, ch.7, App. A, B (independent) plus the official ITIL (Version 5) Master Glossary where marked [glossary], and open-exam-prep.com where marked [online] (independent)\n---\n# Module 3 Lesson B: Product and service terms\nHub: [[Work & Career]] · [[ITIL 5 Foundation - Charter]] · [[Book Map]] · [[M3]] · [[M4]]\n\nRead time: about 10 minutes. Read after [[M3-M4 Lesson A - Value chain, practices, metrics, improvement]]. Source: Book ch.5, ch.7, Appendix A and B.\n\nThis lesson covers the product and service terms the syllabus lists next to the value chain. Where the book gives no definition, the row is filled from the official Master Glossary (marked **[glossary]**) or, if the glossary has no entry, from an online study guide (marked **[online]**). The syllabus (v5.1) lists these terms but does not define them.\n\n## 1. Building and releasing\n| Term | Plain words (book) |\n|---|---|\n| **Product specification** | A documented description of the properties, requirements and characteristics of a product, service or configuration item |\n| **Product prototype** | An initial version used to demonstrate form, functionality and operation before full development or release |\n| **Release** (syllabus: \"release and testing\") | A version of a product, service or configuration item, or a collection of them, made available for use |\n| **Test** | [online] The glossary has no entry for test itself (only test environment: a controlled environment set up to test products, services and items). Checks an aspect of a product, service or component against requirements or expectations. It can happen repeatedly through development. In the book, testing and validation sit in the **transition** activity: functional, performance, security and user acceptance testing |\n| **Continuous integration (CI)** | Developers frequently merge code into a central repository, followed by automated builds and tests |\n| **Continuous delivery (CD)** | Updates can be deployed to production at any time, though each deployment is decided case by case (often to keep a slower rate) |\n| **Continuous deployment** | [glossary] Every change that passes the automated tests is deployed to production automatically, with no extra authorization. It relies on continuous delivery. Compare delivery: changes can be deployed at any time, but a deployment decision is still taken |\n\nOrder of thought: specification, then prototype, then build with CI, then test, then release, then deploy.\n\nDeployment approaches named in the chapter: automated pipelines, blue-green deployments, rolling updates, canary releases.\n\n## 2. Reliability\n| Term | Plain words |\n|---|---|\n| **Reliability** | The ability of a product, service or item to perform its intended function for a specified period of time or number of cycles |\n| **Site reliability engineering (SRE)** | A discipline that applies software engineering to infrastructure and operations problems, to build scalable and highly reliable systems |\n| **Observability** | [glossary] The ability to understand the internal state of a complicated system by analysing its external outputs, such as metrics, logs and traces |\n\n## 3. Incidents, events, requests and problems\n| Term | Plain words |\n|---|---|\n| **Event** | Any change of state that has significance for the management of a service or other configuration item |\n| **Incident** | An unplanned interruption to a service, or a reduction in the quality of a service |\n| **Service request** | [glossary] A request from a user, or the user's authorized representative, that starts a service action which has been agreed as a normal part of service delivery |\n| **Problem** | [glossary] A cause, or potential cause, of one or more **incidents**. (The book's Problem Management purpose: reduce the likelihood and impact of incidents by finding actual and potential causes and managing workarounds and known errors) |\n| **Known error** | [glossary] A problem that has been analysed but not resolved. (A workaround can reduce impact but is not part of the definition) |\n| **Error** | [glossary] A flaw or vulnerability that may cause incidents |\n| **Disaster** | [glossary] A sudden, unplanned event that causes great damage or serious loss, so the organization cannot provide critical business functions for a predetermined minimum period. (Disaster recovery plans cover recovering and returning to the pre-disaster condition) |\n\nHow they relate (from the book's practice purposes and support/operate sections):\n- **Monitoring and event management** observes changes of state (events).\n- An unplanned **incident** is handled by **incident management**: restore normal service quickly.\n- **Problem management** works on the causes, so incidents happen less often and hurt less.\n- **Resilience** means redundancy, failover, backup and recovery.\n\nError, problem and known error are **not three mandatory stages**. They are related terms. For the exam, the syllabus asks you to define them at level 1. The syllabus (4.4.10) also asks you to distinguish a problem, an error and a known error. The Master Glossary defines error, known error, problem and disaster, so those rows are official wording.\n\n## 4. Operating model and value chain (link)\nThe **operating model** describes how the organization co-creates value and runs itself. Value chain activities and management practices support it. The **key success metrics of the value chain activities** are the measures linked to each activity (for example resolution time for support, deployment success rate for transition). See [[M3-M4 Lesson A - Value chain, practices, metrics, improvement]].\n\n## 5. Mix-ups to avoid\n| Looks like | Actually |\n|---|---|\n| Event vs incident | An event is any significant change of state; an incident is an unplanned interruption or quality drop |\n| Incident vs problem | Incident = the interruption; problem = the cause (or potential cause) of incidents |\n| Continuous delivery vs continuous deployment | Delivery: can deploy at any time, decided case by case. Deployment: updates go straight into the live environment |\n| Specification vs prototype | Specification describes requirements; prototype is an early working version |\n| Error vs problem vs known error | Error: a flaw that may cause incidents. Problem: an actual or potential cause of incidents. Known error: an analysed problem not yet resolved |\n\n## Self-check (answer without looking)\n1. Define incident in one line.\n2. What is the difference between an event and an incident?\n3. What does problem management aim to reduce, and how?\n4. Specification or prototype: which is an early version used to show form and function?\n5. What does continuous integration do?\n6. What is SRE?\n7. Define reliability.\n8. What is a release?\n9. Define a known error.\n10. Which is a flaw or vulnerability that may cause incidents: error or problem?\n11. What is continuous deployment?\n12. Define a disaster.\n\n## Answers\n1. An unplanned interruption to a service, or a reduction in its quality.\n2. An event is any significant change of state; an incident is an unplanned interruption or drop in quality.\n3. The likelihood and impact of incidents, by finding actual and potential causes and managing workarounds and known errors.\n4. Prototype.\n5. Developers frequently merge code into a central repository, followed by automated builds and tests.\n6. A discipline that applies software engineering to infrastructure and operations problems to build scalable, highly reliable systems.\n7. The ability to perform the intended function for a specified period or number of cycles.\n8. A version of a product, service or item (or a group of them) made available for use.\n9. An analysed problem that is not yet resolved. A workaround is not required.\n10. Error. A problem is an actual or potential cause of incidents.\n11. Every change that passes the automated tests is deployed to production automatically, with no extra authorization.\n12. A sudden, unplanned event that causes great damage or serious loss, so critical business functions can't be provided for a predetermined minimum period.\n"},{"order":4,"optional":false,"id":"M3-M4-Lesson-A","modules":["M3","M4"],"title":"Module 3-Module 4 Lesson A: Value chain, management practices, metrics, continual improvement","md":"---\ntype: lesson\nproject: ITIL 5 Foundation\narea: work-career\nmodule: M3\ntags: [itil5, lesson]\nsource: Ultimate ITIL Version 5 Foundation Certification Guide, ch.7 and Appendix A, B (independent source)\n---\n# Module 3-Module 4 Lesson A: Value chain, management practices, metrics, continual improvement\nHub: [[Work & Career]] · [[ITIL 5 Foundation - Charter]] · [[Book Map]] · [[M3]] · [[M4]]\n\nRead time: about 12 minutes. Source: Book ch.7, Appendix A, Appendix B. Read [[M2 Lesson A - Value system and guiding principles]] first.\n\n## 1. Value chain and value streams\n- **Value chain**: the whole set of activities that enables value through a product or service. It turns demand and opportunities into value.\n- **Value stream**: a series of steps used to create and deliver a product or service to a consumer. It is built by combining value chain activities in a specific order for a specific purpose.\n\nThe chain is the toolbox. A stream is one job done with it.\n\nThe book names the V5 value chain activities as the same eight as the lifecycle: discover, design, acquire, build, transition, operate, deliver, support. Improvement is embedded in all of them. (The chapter also mentions ITIL 4's six activities for comparison. Do not study those for this exam.)\n\nKey traits:\n- The activities are **not a fixed sequence**. They can run in parallel, repeat, or happen in a different order for each value stream.\n- Each activity takes inputs and produces outputs that feed the others.\n- **Feedback loops** carry what is learned in operate and support back to discover and design.\n\nValue stream examples: resolving a major incident, launching a new digital product, onboarding a customer.\n\n## 2. Management practices\nA **management practice** is an organizational capability for doing a type of work. It combines processes, roles, tools, knowledge and skills, so it is broader than a process. Practices let the organization actually run the value chain activities.\n\nExamples of how practices support activities (book):\n| Activity | Practices that support it |\n|---|---|\n| Discover | relationship management, service desk, service request management |\n| Design | service design, architecture management |\n| Acquire / Build | supplier management, software development, resource management |\n| Transition | change enablement, release management |\n| Operate / Deliver | monitoring and event management, service level management, capacity and availability management |\n| Support | incident management, problem management |\n\nOne activity can use many practices, and one practice can serve many activities.\n\n## 3. The two practice groups\nV5 groups practices into **two groups**: general management practices and product and service management practices. (ITIL 4 had three groups; do not mix them.)\n\n**General management practices (12, book count):** strategy management, portfolio management, risk management, workforce and talent management, architecture management, knowledge management, organizational change management, continual improvement, measurement and reporting, project management, relationship management, supplier management.\n\n**Product and service management practices (22, book count):** incident, problem, change enablement, service request, service level, monitoring and event, service desk, service configuration, release, deployment, infrastructure and platform, software development and management, availability, business analysis, capacity and performance, information security, IT asset, service catalogue, service continuity, service design, service financial, service validation and testing.\n\nThe counts and the full name lists are from the book. For the exam, be sure of the two group names and what a practice is.\n\n## 4. Practice guides\nEach practice has a **practice guide** with a consistent structure: purpose, key concepts, activities, roles, performance considerations. Benefits: consistent, practical and adaptable guidance; better measurement; alignment with business goals; flexible adoption to fit context and maturity. (The book says the current guides are the ITIL 4 ones, with updates planned.)\n\nAppendix B of the book gives a one-line purpose for each practice. Three to know now:\n- **Incident management**: minimize the negative impact of incidents by restoring normal service as quickly as possible.\n- **Problem management**: reduce the likelihood and impact of incidents by finding actual and potential causes and managing workarounds and known errors.\n- **Change enablement**: make sure risks are assessed, authorize changes, and manage a change schedule to maximize successful changes.\n\n## 5. Metrics and critical success factors\n| Term | What it is | Question it answers |\n|---|---|---|\n| **Critical success factor (CSF)** | A necessary condition for success | What must we achieve to succeed? |\n| **Metric** | A measurement or calculation that is monitored or reported for management and improvement | Are we achieving it? |\n\nCSF first, then metrics to check it. Example: CSF for incident management is restoring service quickly with minimal user impact. Metric is average resolution time.\n\nRelated terms in the book:\n- **Practice success factor (PSF)**: defines what success looks like for a practice.\n- Metrics are linked to value chain activities, for example resolution time for support or deployment success rate for transition. Value stream metrics include lead time, cycle time and throughput.\n- **Outcome-based measurement** matters more in V5. Uptime alone is not enough; also measure productivity, satisfaction and adoption.\n\n### Key success metrics of the value chain activities\nEach value chain activity is judged by measures that fit its job. Learn the pattern, not exact numbers.\n| Activity | What its metrics look at | Examples |\n|---|---|---|\n| **Discover** | How well needs, stakeholder feedback and opportunities are identified | Quality of requirements captured, stakeholder feedback, opportunities recognized |\n| **Design** and **Transition** | Quality and control of what is designed and released | Release frequency, deployment success rate, defect detection |\n| **Acquire** and **Build** | Productivity and reliability of creating components | Development productivity, integration reliability, delivery against timelines |\n| **Operate**, **Deliver** and **Support** | Stability and service performance | Incident resolution time, service availability, operational stability |\n| **Improvement** (embedded in all) | Whether improvements are made and work | Number of improvement initiatives and their effect on performance |\n\nNote the flow versus outcome split: flow metrics (lead time, cycle time, throughput) show how efficiently work moves, and outcome and experience measures (satisfaction, adoption) show whether it produced value. The syllabus asks you to understand these measures (4.4.11). The Official Book tabulates them per activity.\n\n## 6. The Continual Improvement Model\nA repeating set of seven questions (book wording):\n| Step | Question |\n|---|---|\n| 1 | What is the vision? |\n| 2 | Where are we now? |\n| 3 | Where do we want to be? |\n| 4 | How do we get there? |\n| 5 | Take action |\n| 6 | Did we get there? (book: \"Are we getting there?\") |\n| 7 | How do we keep the momentum going? (book: \"How do we keep the improvements relevant?\") |\n\nMemory hook: vision, now, target, plan, do, check, sustain.\n\nSource note: an online ITIL 5 study guide gives steps 6 and 7 as \"Did we get there?\" (check results against targets) and \"How do we keep the momentum going?\" (embed the change and keep improving; it loops back to step 1). the certification body's community blog says the number of steps is unchanged but some were reworded. The book words them differently. The syllabus (v5.1) asks you to list the steps (4.6.1) and understand them (4.6.2), and refers to the Official Book for the steps, so it does not print the wording. Learn what each step means; either wording will be recognizable.\n\nRules around it:\n- Align with the vision first, so improvements do not just optimize one corner.\n- Set measurable targets (step 3).\n- Check with data (step 6), and keep going (step 7).\n- It is embedded in value streams and lifecycle activities, not a side project.\n- Culture matters: leaders encourage experimenting, teams keep an improvement backlog, lessons learned are shared.\n\n\n## 7. Automation and AI in the value chain\nAutomation does repeat tasks with little human effort. AI analyses data, finds patterns, predicts problems and recommends actions (ticket classification, virtual assistants, predicting outages). Both need **governance**: reliable, explainable and in line with policy and ethics. This links to Module 6.\n\n## Self-check (answer without looking)\n1. Value chain vs value stream: which is the set of activities and which is one workflow?\n2. Are the value chain activities a fixed sequence?\n3. How many practice groups does V5 have, and what are they called?\n4. Which practice restores service quickly after an interruption?\n5. CSF vs metric: which is the condition and which is the measurement?\n6. Give the seven steps of the Continual Improvement Model (either wording for steps 6 and 7).\n7. Where does improvement live: a separate activity or embedded?\n8. What must automation and AI be supported by?\n9. Which kind of metric suits Support: incident resolution time, or development productivity?\n10. Which activities are judged by release frequency and deployment success rate?\n\n## Answers\n1. Chain is the set of activities; stream is one specific workflow built from them.\n2. No. They can run in parallel, repeat and change order.\n3. Two: general management practices; product and service management practices.\n4. Incident management. Problem management finds and reduces causes.\n5. CSF is the condition for success; metric is the measurement used to check it.\n6. Vision; where are we now; where do we want to be; how do we get there; take action; are we getting there; how do we keep the improvements relevant.\n7. Embedded across value chain activities and value streams.\n8. Governance and oversight.\n9. Incident resolution time (development productivity suits Build).\n10. Design and Transition.\n"},{"order":6,"optional":false,"id":"M5-Lesson-A","modules":["M5"],"title":"Module 5 Lesson A: Four dimensions, external factors (PESTLE) and the lifecycle","md":"---\ntype: lesson\nproject: ITIL 5 Foundation\narea: work-career\nmodule: M5\ntags: [itil5, lesson]\nsource: Ultimate ITIL Version 5 Foundation Certification Guide, ch.3, ch.5, Appendix A (independent source)\n---\n# Module 5 Lesson A: Four dimensions, external factors (PESTLE) and the lifecycle\nHub: [[Work & Career]] · [[ITIL 5 Foundation - Charter]] · [[Book Map]] · [[M5]]\n\nRead time: about 12 minutes. Source: Book ch.3, ch.5, Appendix A.\n\n## 1. The four dimensions\nA way to look at any product or service as a whole. Consider **all four together** so no single area is missed. A change in one dimension usually affects the others.\n\n| Dimension | What it covers | Example question |\n|---|---|---|\n| **Organizations and people** | Culture, leadership, skills, structure, human and AI collaboration | Do we have the skills and the right team structure? |\n| **Information and technology** | Platforms, infrastructure, automation and AI, data, information, knowledge | Do we have the tools and the data? |\n| **Partners and suppliers** | Suppliers, sourcing models, ecosystem collaboration, service relationships | Which parts do outside organizations provide? |\n| **Value streams and processes** | How work flows: workflow design, process optimization, managing complexity | Are the workflows efficient and clear? |\n\nWhy it matters: focusing only on processes or only on tools creates silos and fragmented outcomes. Example: introducing an automation platform also needs new skills, supplier changes, new policies and redesigned workflows.\n\nMemory hook: **people, technology, partners, work flow**.\n\n### What each dimension contains (book detail)\n- **Organizations and people**: culture and leadership (vision, trust, support for innovation, empowering teams); skills and competencies; organizational structure (product-focused, cross-functional teams); human and AI collaboration.\n- **Information and technology**: technology foundations; AI and automation (human oversight stays essential); **data, information, knowledge**; technology as an enabler of value.\n- **Partners and suppliers**: service relationships; supplier relationships; **sourcing models**; ecosystem collaboration.\n- **Value streams and processes**: workflow design; process optimization; managing complexity.\n\n### Data, information, knowledge\n- **Data**: raw facts without context.\n- **Information**: data organized and given context.\n- **Knowledge**: information combined with experience and analysis, enabling decisions.\n\n### Sourcing models\nInsourcing (do it internally), outsourcing (contract it out), co-sourcing (internal and external together), cloud-based sourcing (infrastructure, platform or software as a service).\n\n### Complexity (book detail)\n**Complexity thinking** is an approach to analysis and decisions that recognizes the levels of complexity in systems and their context. Four contexts:\n| Context | Meaning |\n|---|---|\n| **Ordered** | Cause and effect are known or knowable |\n| **Complex** | Cause and effect can only be understood afterwards |\n| **Chaotic** | A crisis that needs immediate action |\n| **Confused** | The nature of the system is not yet understood (the starting point) |\n\n## 2. External factors: PESTLE\nFactors outside your control that shape how you design and run products and services.\n\n| Letter | Factor | Think |\n|---|---|---|\n| **P** | Political | Government policy, trade and data-sharing rules |\n| **E** | Economic | Inflation, interest rates, costs, demand |\n| **S** | Social | Customer expectations, culture, accessibility |\n| **T** | Technological | New technology and how fast it changes |\n| **L** | Legal | Laws and regulation, compliance |\n| **E** | Environmental | Sustainability, energy use |\n\nSyllabus v5.1 spells these \"Economic\" and \"Technological\".\n\n## 3. The Product and Service Lifecycle\nThe lifecycle is the model for managing products and services through **eight activities**. It is **iterative and not strictly linear**: activities can repeat, overlap or happen in a different order, and what you learn later sends you back. Test results can lead to a redesign; operations feedback can start new discovery.\n\n| Activity | Purpose (one line) | Typical outputs |\n|---|---|---|\n| **Discover** | Identify needs, opportunities, demand and possible value before anything is designed or changed | Opportunity assessments, concepts, requirements, roadmaps |\n| **Design** | Structure the product or service so it meets needs and supports the outcomes | Architecture, specifications, UX designs, security and compliance frameworks |\n| **Acquire** | Obtain the resources, components, products, services or supplier capabilities | Contracts, acquired components, sourcing strategies |\n| **Build** | Create, configure, develop and integrate the components | Applications, environments, tested components, release packages |\n| **Transition** | Move new or changed products and services into controlled environments through release, testing and deployment | Releases, validated and deployed changes |\n| **Operate** | Keep live products and services running reliably and effectively | Monitoring, performance data, availability |\n| **Deliver** | Make products and services available so consumers can reach the agreed outcomes | Enabled outcomes, SLA performance, experience insights |\n| **Support** | Respond to user needs, incidents, problems, service requests and resilience issues | Resolved incidents, workarounds, continuity |\n\nOrder to remember: **Discover, Design, Acquire, Build, Transition, Operate, Deliver, Support** (DDABTODS).\n\nPoints the book stresses:\n- It ties to Agile, DevOps and continuous delivery: small steps and fast feedback.\n- Feedback from operate, deliver and support goes back to discover and design.\n- Improvement runs through every activity.\n\n## 4. Mix-ups to avoid\n| Looks like | Actually |\n|---|---|\n| \"The lifecycle is a sequence\" | It is iterative, not always linear |\n| Four dimensions vs PESTLE | Dimensions are internal to the organization and its network; PESTLE is outside factors |\n| Operate vs Deliver vs Support | Operate keeps it running; Deliver makes it available for outcomes; Support responds to users, incidents, problems |\n| Acquire vs Build | Acquire obtains from outside; Build creates and integrates |\n\n## Self-check (answer without looking)\n1. Name the four dimensions.\n2. A company adds an AI tool. Name two dimensions beyond information and technology that it will touch.\n3. What do the letters in PESTLE stand for?\n4. Name the eight lifecycle activities in order.\n5. Are the lifecycle activities a strict sequence?\n6. Which activity moves a change into a controlled live environment?\n7. Which activity responds to incidents and problems?\n8. Data, information, knowledge: which one is raw facts with no context?\n9. In which context can cause and effect only be understood afterwards?\n\n## Answers\n1. Organizations and people; information and technology; partners and suppliers; value streams and processes.\n2. For example organizations and people (new skills) and value streams and processes (changed workflows), or partners and suppliers (vendor).\n3. Political, economic, social, technological, legal, environmental.\n4. Discover, design, acquire, build, transition, operate, deliver, support.\n5. No. They are iterative and not always linear.\n6. Transition.\n7. Support.\n8. Data.\n9. Complex.\n"},{"order":7,"optional":false,"id":"M6-Lesson-A","modules":["M6"],"title":"Module 6 Lesson A: Value streams, AI, and the wider ITIL picture","md":"---\ntype: lesson\nproject: ITIL 5 Foundation\narea: work-career\nmodule: M6\ntags: [itil5, lesson]\nsource: Ultimate ITIL Version 5 Foundation Certification Guide, ch.8, ch.9, App. A (independent) plus open-exam-prep.com ITIL V5 guide where marked [online] (independent)\n---\n# Module 6 Lesson A: Value streams, AI, and the wider ITIL picture\nHub: [[Work & Career]] · [[ITIL 5 Foundation - Charter]] · [[Book Map]] · [[M6]]\n\nRead time: about 14 minutes. Source: Book ch.8, ch.9, Appendix A.\n\n## 1. Value streams\nA **value stream** is a series of steps an organization uses to create and deliver products and services to a service consumer. It is built by combining lifecycle and value chain activities for a specific purpose.\n\nTwo kinds:\n| | Core value stream | Enabling value stream |\n|---|---|---|\n| Who gets the value | Consumers, in the form the operating model intends | Internal customers |\n| Role | The main way products and services reach customers | Supports the core value streams |\n| Examples | Developing and delivering a digital product, customer onboarding, incident resolution for critical services | Supplier onboarding, infrastructure provisioning, knowledge management and training, tooling and platform management |\n\nPoints to know:\n- Core streams depend on enabling streams for tools, resources, governance and knowledge. Improving an enabling stream often helps several core streams.\n- The labels depend on perspective. A stream can be core to one team and enabling to the wider enterprise.\n- Streams can be layered: a big core stream can contain smaller streams, some of them enabling.\n- Value stream thinking means optimizing the **whole flow of value**, not single processes or functions.\n\n## 2. Value stream mapping (VSM)\n**Value stream mapping** is visualizing the steps, flow, dependencies and delays involved in creating and delivering value. It shows work, information and decisions, not only physical flow.\n\nWhat a map includes:\n- Activities and workflow steps (including decision points)\n- Flows of information and artifacts (tickets, designs, approvals)\n- Stakeholders and roles, and the hand-offs between them\n- Inputs and outputs for each step\n- Sequence and dependencies (linear, parallel, feedback loops, iterations)\n- Time and performance indicators: lead time, cycle time, waiting time, throughput\n- Where value is created: value-adding steps, necessary non-value-adding steps, and waste\n\nThe book's five stages of mapping:\n1. Value stream identification\n2. Map the as-is\n3. Analyze it\n4. Map the to-be\n5. Plan and implement improvements\n\nWhy do it: find bottlenecks, waste and dependencies, and improve flow and quality. It is a tool for diagnosis and decisions.\n\n## 3. Value stream management\n**Value stream management** is the ongoing management and improvement of value streams to optimize flow, performance and value delivery. Typical measures are flow metrics such as lead time and throughput. Mapping is a one-off picture; management is continuous.\n\n## 4. Complexity thinking (recap from Module 5)\nFour contexts: ordered, complex, chaotic, confused. Value streams should be designed for the level of complexity they operate in.\n\n### Optimizing workflows for complexity (syllabus 5.2.1)\nIn complex systems, cause and effect are unclear and outcomes come from the interactions across the whole system. So optimization is not about forcing rigid standardization. It is about improving **flow** while managing variability. The book's guidance:\n- **Focus on end-to-end flow**, not single activities. Improving one step does not guarantee a better outcome.\n- **Embrace non-linearity and iteration**: feedback loops, rework, continuous testing.\n- **Manage dependencies**: find them, reduce the unnecessary ones, decouple where possible.\n- **Balance standardization and flexibility**: standardize where stability is needed, allow flexibility where variation is expected.\n- **Visualize** with value stream mapping to reveal bottlenecks and hidden dependencies.\n- **Optimize for the whole system**: avoid improving one silo at the expense of the rest.\n- **Use automation and AI carefully**, so they ease flow and do not add new bottlenecks.\n- **Keep monitoring and adapting**: optimization is continuous.\n\nTechniques: value stream mapping, bottleneck analysis, flow metrics (lead time, cycle time, throughput), dependency reduction, small iterative improvements.\n\n## 5. The operating model\nAn **operating model** is a representation of how an organization co-creates value with its customers and other stakeholders, and how it runs itself. It links **purpose** (what you do, for whom, why) to **execution**. Its elements line up with the four dimensions. Core value streams are its \"heartbeat\"; value chain activities and management practices support it.\n\n## 6. AI in ITIL 5 (know the definitions)\n| Term | Plain words |\n|---|---|\n| **AI** | Digital systems doing tasks that normally need human intelligence: learning from data, spotting patterns, predicting, supporting decisions |\n| **AI maturity** | How well an organization can use AI effectively, responsibly and consistently (governance, data quality, skills, processes, ethics) |\n| **GenAI** | AI that creates new content (text, images, code) from patterns learned from existing data |\n| **Agentic AI** | AI that acts for users, doing predefined tasks on its own inside agreed boundaries, under human oversight and governance |\n| **AI governance** | The system for directing, controlling and monitoring AI use so AI-enabled products create value and stay ethical, secure and compliant |\n\nGovernance is \"the system by which an organization is directed and controlled.\" AI governance applies that to AI, adding accountability, ethics, and control of risks like bias and lack of transparency.\n\n### The ITIL AI Capability Model (the 6C model)\nSix capability areas, all starting with C:\n| C | Meaning (book) |\n|---|---|\n| **Creation** | AI generates net-new outputs (content, code, documentation) |\n| **Coordination** | AI executes, orchestrates or triggers actions across systems |\n| **Communication** | AI acts as a natural interface for users and explains its decisions |\n| **Cognition** | AI finds patterns, anomalies and insights in data |\n| **Clarification** | AI helps people find, understand, summarize or translate existing content |\n| **Curation** | AI improves the quality and organization of existing data and knowledge |\n\nOrder to recall: **Creation, Coordination, Communication, Cognition, Clarification, Curation.**\n\n## 7. ITIL practice guides: structure and benefits\nEach **practice guide** has the same seven-chapter structure:\n1. General information (purpose, scope, key concepts)\n2. Value streams and processes\n3. Organizations and people\n4. Information and technology\n5. Partners and suppliers\n6. Capability assessment and development\n7. Recommendations for practice success\n\nNote chapters 2 to 5 mirror the four dimensions.\n\nBenefits: consistent, practical, adaptable guidance; better measurement; alignment with business goals; better decisions; support for continual improvement; flexible adoption to fit context and maturity.\n\n## 8. Maturity and transformation (book detail)\n- **ITIL maturity model**: a way to assess how capable the organization's practices are and how well the wider value system is governed, measured and improved. Practice **capability** (one practice) is different from organizational **maturity** (the whole system).\n- **ITIL transformation model**: guidance for planning, governing, executing and sustaining major change, so change is coordinated and not fragmented.\n- **Transformation** (as a term): a significant organizational change that alters how the organization works, delivers or creates value. **Business as usual** is the normal ongoing operation.\n\n## 9. ITIL with other frameworks\nThe syllabus lists **DevOps** and **PRINCE2**. ITIL complements them; it does not compete with them.\n- **DevOps** adds speed and flow between development and operations: continuous integration and delivery, automation, shared ownership, rapid feedback. ITIL adds service management structure, governance and an end-to-end focus on value. (The book describes DevOps as collaboration between development and operations that supports iteration and continuous delivery.)\n- **PRINCE2** [online] adds structured project governance: defined roles, stages and controls for finite projects such as a transformation, migration or build. ITIL then runs, improves and manages the result across the product and service lifecycle.\n\n## 10. AI across the lifecycle and value chain\nAI can support every lifecycle activity and the value chain. [online] Examples: correlating events, triaging and categorizing incidents, predicting problems before outages, generating and maintaining knowledge articles, virtual agents for service requests, and capacity forecasting. The book gives similar examples: ticket classification, virtual assistants, predictive monitoring, automated root cause analysis. The rule: AI **augments** human work, under governance and oversight, and does not replace every human role.\n\n## 11. The purpose of AI in digital product and service management (6.1.3)\nAI exists in ITIL 5 to help organizations create and run digital products and services better and faster: analysing data, spotting patterns and anomalies, predicting problems, automating routine work, supporting decisions and improving user experience. It **augments** people and does not replace all human roles, and it must be governed so it stays ethical, secure and compliant. AI is both an automation enabler and something that needs governance.\n\n## 12. Why project management matters in ITIL (7.2.1)\nSome work is a **finite project** (a major transformation, migration or build) while ITIL manages products and services **continuously** across their lifecycle. Project management gives the finite work structure: defined roles, stages, controls, scope and a start and an end. The book lists a project management practice whose purpose is ensuring projects are delivered successfully. The project delivers a change; ITIL then runs, supports and improves it (online guide). That is why the two complement each other.\n\n## Self-check (answer without looking)\n1. Define core and enabling value streams in one line each.\n2. What does value stream mapping show, and what are the five mapping stages?\n3. Why can the same value stream be core in one view and enabling in another?\n4. Define GenAI and agentic AI in your own words.\n5. What does AI governance add to normal governance?\n6. List the six Cs of the AI capability model.\n7. How many chapters does a practice guide have, and which ones mirror the four dimensions?\n8. Capability vs maturity: which applies to one practice, and which to the whole system?\n9. How does DevOps relate to ITIL: competitor or complement, and what does each add?\n10. What does PRINCE2 add that ITIL's lifecycle does not focus on?\n11. Name two ways AI can support incident and problem work.\n12. What is the purpose of AI in digital product and service management?\n13. Why does workflow optimization in a complex system focus on flow and not single activities?\n14. Why is project management important in ITIL?\n\n## Answers\n1. Core: delivers value to consumers in the form the operating model intends. Enabling: supports the core streams by serving internal customers.\n2. It shows steps, flow, dependencies and delays. Stages: identify, map as-is, analyze, map to-be, plan and implement improvements.\n3. Because the classification depends on the perspective and context (for example a payroll service is core for the HR team but enabling for the enterprise).\n4. GenAI creates new content from learned patterns. Agentic AI acts on a user's behalf on predefined tasks within agreed boundaries, under human oversight.\n5. It adds accountability, ethical alignment and control of AI-specific risks like bias and opacity.\n6. Creation, coordination, communication, cognition, clarification, curation.\n7. Seven. Chapters 2 to 5 (value streams and processes, organizations and people, information and technology, partners and suppliers) mirror the four dimensions.\n8. Capability applies to one practice; maturity applies to the whole system.\n9. Complement. DevOps adds speed and flow (CI/CD, automation, shared ownership); ITIL adds service management structure, governance and end-to-end value focus.\n10. Structured governance for finite projects: roles, stages and controls.\n11. For example triaging and categorizing incidents, correlating events, and predicting problems before outages.\n12. To help create and run products and services better and faster by analysing data, predicting problems, automating routine work and supporting decisions, while augmenting people under governance.\n13. Because improving one activity does not guarantee a better outcome; results come from interactions across the whole system.\n14. It gives finite work (transformations, migrations, builds) structure with roles, stages and controls; ITIL then runs and improves the result.\n"},{"order":1,"optional":false,"id":"M7-Lesson-A","modules":["M0"],"title":"Module 7 Lesson A: The exam and how to answer it","md":"---\ntype: lesson\nproject: ITIL 5 Foundation\narea: work-career\nmodule: M7\ntags: [itil5, lesson]\nsource: Ultimate ITIL Version 5 Foundation Certification Guide, ch.10 (independent source; its exam facts match Syllabus v5.1)\n---\n# Module 7 Lesson A: The exam and how to answer it\nHub: [[Work & Career]] · [[ITIL 5 Foundation - Charter]] · [[Book Map]] · [[M7]]\n\nRead time: about 8 minutes. Read before your first practice exam. Source: Book ch.10.\n\n## 1. Format (know these cold)\n| Item | Fact |\n|---|---|\n| Questions | **40** multiple choice, one mark each |\n| Pass mark | **26** correct (65%) |\n| Time | **60 minutes** (75 minutes for non-native-language candidates) |\n| Negative marking | **None**: always answer every question |\n| Materials | **Closed book** |\n| Question style | Objective test questions: predefined options, one right answer |\n\nSince there is no penalty, never leave a question blank. Eliminate options, then guess.\n\nTiming: 60 minutes for 40 questions is 90 seconds each. Flag hard questions, finish the rest, then return.\n\n## 2. What the exam tests: Bloom's levels\nThe exam covers two levels only.\n| Level | Verb in the syllabus | What you must do |\n|---|---|---|\n| **Level 1: Remember** | Recall, define | Recognize definitions, terms, lists and basic facts |\n| **Level 2: Understand** | Describe, explain, understand | Show you understand a concept and how concepts relate (for example output vs outcome, utility vs warranty) |\n\nThere are no application or analysis questions. The syllabus states the split: **40% level 1 and 60% level 2**.\n\nHow to prepare for each:\n- **Level 1**: be exact on names, lists and definitions.\n- **Level 2**: be able to explain the difference between similar concepts and say what a concept means in practice.\n\n## 3. Question types\n| Type | What it looks like | Watch for |\n|---|---|---|\n| **Standard multiple choice** | One question, four options, pick one | Most common. Tests recognition and simple understanding |\n| **Negative** | \"Which is **NOT**...\" | Used sparingly. Read the question twice |\n| **Missing word** | A sentence with a gap | Needs the exact ITIL wording in context |\n| **List-based** | Four statements; choose the **two** correct ones. Options are pairs such as \"1 and 2\" | Harder: decide each statement, then match the pair. **Never negatively phrased** |\n\nDistractors (wrong options) are written to look plausible and reflect common mix-ups, so closely related concepts are where marks are lost.\n\n## 4. How to answer\n1. Read the stem, then **underline** a key word (NOT, which two, best).\n2. Decide your own answer before reading the options when you can.\n3. Cross out options that are clearly wrong. Several are usually close, so find the exact difference.\n4. In list questions, test each of the four statements true or false first, then pick the pair.\n5. Answer every question. Flag and return if unsure.\n\n## 5. Where the marks are\nThe exam is spread across the syllabus in line with its weights. The biggest areas are **key concepts** and the **value system**, so most of your time belongs there. Your own plan targets these modules first (Modules 1 to 4).\n\n## 6. The certification path (context only)\nFoundation is the entry point and the only mandatory prerequisite for the core pathways (the book names Practice Manager, Managing Professional, Strategic Leader and a Transformation module). The book mentions an AI governance extension module. This is not exam content.\n\n## 7. Using this app for exam practice\n- **Quiz tab, practice exam**: 40 questions, 60 minutes, pass line 26. Your own target is 32, so you pass with room to spare.\n- **Quiz tab, Weak spots**: questions on what you missed.\n- **Learn tab, self-checks**: Level 2 practice. Say the answer out loud before revealing it.\n- Mix up similar terms deliberately: output vs outcome, utility vs warranty, customer vs user vs sponsor, basic vs cooperative vs collaborative, core vs enabling streams.\n\n## Self-check (answer without looking)\n1. How many questions are on the exam, and how many must you get right?\n2. How long do you have?\n3. Is a wrong answer penalized?\n4. Which two Bloom's levels are tested?\n5. How many correct statements do you choose in a list question?\n6. Are list questions ever phrased negatively?\n7. Which area of the syllabus should get the most study time?\n\n## Answers\n1. 40 questions; 26 correct to pass (65%).\n2. 60 minutes (75 for non-native-language candidates).\n3. No. There is no negative marking, so answer everything.\n4. Level 1 (remember) and level 2 (understand).\n5. Two.\n6. Never.\n7. The key concepts and the value system, which carry the largest weights.\n"}],"uq":[{"id":"U001","module":"M1","type":"mc","q":"A team reports 300 tickets closed this month. The sponsor says the real question is whether users are disrupted less. What distinction is the sponsor drawing?","options":["Output (what was produced) versus outcome (the result for the consumer)","Utility (what it does) versus warranty (how it performs)","Cost (money spent) versus risk (possible harm)","Customer (defines requirements) versus user (uses the service)"],"correctIndex":0,"explain":"Tickets closed is an output. Fewer disruptions for users is an outcome.","source":"Book ch.2, ch.4, App. A (independent)"},{"id":"U002","module":"M1","type":"gap","q":"A service enables value co-creation by facilitating outcomes that consumers want to achieve without the consumer having to manage specific ______.","options":["costs and risks","tools and licences","suppliers and contracts","skills and roles"],"correctIndex":0,"explain":"The service definition: outcomes without the consumer managing specific costs and risks.","source":"Book ch.2, ch.4, App. A (independent)"},{"id":"U003","module":"M1","type":"mc","q":"A hosted tool has every feature a team needs but is unavailable most weeks. Which aspect of the service is weak?","options":["Warranty","Utility","Output","Sustainability"],"correctIndex":0,"explain":"Features are utility. Availability, capacity, continuity and security are warranty.","source":"Book ch.2, ch.4, App. A (independent)"},{"id":"U004","module":"M1","type":"mc","q":"Which question does utility answer?","options":["What does the service do?","How reliably does it run?","Who pays for it?","Who approved it?"],"correctIndex":0,"explain":"Utility is fit for purpose: the functionality. Warranty answers how it performs.","source":"Book ch.2, ch.4, App. A (independent)"},{"id":"U005","module":"M1","type":"mc","q":"Which role authorizes the budget for service consumption?","options":["Sponsor","Customer","User","Service provider"],"correctIndex":0,"explain":"Sponsor authorizes the budget. The customer defines requirements and owns outcomes; the user uses the service.","source":"Book ch.2, ch.4, App. A (independent)"},{"id":"U006","module":"M1","type":"mc","q":"Which role defines requirements and is responsible for the outcomes of service consumption?","options":["Customer","Sponsor","User","Digital product vendor"],"correctIndex":0,"explain":"The customer role defines requirements and takes responsibility for outcomes.","source":"Book ch.2, ch.4, App. A (independent)"},{"id":"U007","module":"M1","type":"neg","q":"Which is NOT one of the three components of a service offering?","options":["Service level targets","Goods","Access to resources","Service actions"],"correctIndex":0,"explain":"A service offering consists of goods, access to resources and service actions.","source":"Book ch.2, ch.4, App. A (independent)"},{"id":"U008","module":"M1","type":"mc","q":"A provider owns and runs a platform and consumers log in to use it. Which component of a service offering does this describe?","options":["Access to resources","Goods","Service actions","A service level agreement"],"correctIndex":0,"explain":"In access to resources the consumer uses resources that stay under the provider's control.","source":"Book ch.2, ch.4, App. A (independent)"},{"id":"U009","module":"M1","type":"mc","q":"A consumer is handed a laptop and from then on manages it. Which component of a service offering is this?","options":["Goods","Access to resources","Service actions","Service interactions"],"correctIndex":0,"explain":"Goods are transferred to the consumer, who then takes responsibility for them.","source":"Book ch.2, ch.4, App. A (independent)"},{"id":"U010","module":"M1","type":"mc","q":"A provider and a consumer jointly plan, improve and co-create value. Which type of service relationship is this?","options":["Collaborative","Basic","Cooperative","Transactional"],"correctIndex":0,"explain":"Collaborative is the deepest of the three: joint planning, improving and c
