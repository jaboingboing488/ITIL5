o-creating value.","source":"Book ch.2, ch.4, App. A (independent)"},{"id":"U011","module":"M1","type":"mc","q":"Provider and consumer coordinate and share information to improve outcomes, but stay separate parties working on their own plans. Which type of service relationship is this?","options":["Cooperative","Basic","Collaborative","Internal"],"correctIndex":0,"explain":"Cooperative sits between basic (limited interaction) and collaborative (joint planning).","source":"Book ch.2, ch.4, App. A (independent)"},{"id":"U012","module":"M1","type":"mc","q":"A cloud platform is easy to use, but support is slow and communication is unclear. Which concept is mainly damaged?","options":["Customer experience","Utility","Output","Warranty"],"correctIndex":0,"explain":"CX is the overall perception across every touchpoint, including support and communication.","source":"Book ch.2, ch.4, App. A (independent)"},{"id":"U013","module":"M1","type":"mc","q":"Which best describes a service level agreement (SLA)?","options":["A documented agreement between a provider and a customer naming the services and the agreed level of each","A tool that monitors service performance","A document that describes the service architecture","A legal contract between two suppliers"],"correctIndex":0,"explain":"An SLA records the services and the agreed service level.","source":"Book ch.2, ch.4, App. A (independent)"},{"id":"U014","module":"M1","type":"gap","q":"Utility is often summarised as fit for purpose; warranty is often summarised as fit for ______.","options":["use","design","delivery","value"],"correctIndex":0,"explain":"Utility: fit for purpose. Warranty: fit for use.","source":"Book ch.2, ch.4, App. A (independent)"},{"id":"U015","module":"M1","type":"list","q":"Which TWO are covered by warranty?\n1. Availability\n2. The feature set\n3. Security\n4. The user interface layout","options":["1 and 2","1 and 3","1 and 4","2 and 3"],"correctIndex":1,"explain":"Warranty covers availability, capacity, continuity and security. Features and layout relate to utility and UX.","source":"Book ch.2, ch.4, App. A (independent)"},{"id":"U016","module":"M1","type":"mc","q":"In ITIL, value is best described as:","options":["The perceived benefits, usefulness and importance of something","The financial return on a service","The functionality a service offers","The amount a consumer pays for a service"],"correctIndex":0,"explain":"Value is perceived, so it depends on who is judging.","source":"Book ch.2, ch.4, App. A (independent)"},{"id":"U017","module":"M1","type":"mc","q":"A mobile banking app is a digital product. Making payments through it is best described as:","options":["A digital service","An output only","A service level","A governance activity"],"correctIndex":0,"explain":"A digital service fully or largely relies on digital products.","source":"Book ch.2, ch.4, App. A (independent)"},{"id":"U018","module":"M1","type":"neg","q":"Which is NOT a role inside the service consumer organization?","options":["Service provider","Customer","User","Sponsor"],"correctIndex":0,"explain":"Customer, user and sponsor are the roles. Service provider is the other organization.","source":"Book ch.2, ch.4, App. A (independent)"},{"id":"U019","module":"M1","type":"mc","q":"How does a service journey differ from a process flow?","options":["A service journey shows how the stakeholder experiences the service; a process flow shows how the provider does the work internally","A service journey is internal; a process flow is external","They are the same thing","A service journey covers only the support stage"],"correctIndex":0,"explain":"A journey reveals delays and hand-offs the customer notices, even if the internal process looks efficient.","source":"Book ch.9, App. A (independent)"},{"id":"U020","module":"M2","type":"neg","q":"Which is NOT a component of the ITIL Value System?","options":["Service desk","Governance","Guiding principles","Continual improvement"],"correctIndex":0,"explain":"The five components: guiding principles, governance, value chain, management practices, continual improvement.","source":"Book ch.6 (independent)"},{"id":"U021","module":"M2","type":"mc","q":"Which component provides direction, oversight and accountability?","options":["Governance","The value chain","Management practices","Continual improvement"],"correctIndex":0,"explain":"Governance directs and oversees; management carries out the work.","source":"Book ch.6 (independent)"},{"id":"U022","module":"M2","type":"list","q":"Which TWO are governance activities?\n1. Engage stakeholders\n2. Build components\n3. Monitor\n4. Acquire suppliers","options":["1 and 2","1 and 3","1 and 4","2 and 3"],"correctIndex":1,"explain":"The four governance activities: engage stakeholders, evaluate, direct, monitor.","source":"Book ch.6 (independent)"},{"id":"U023","module":"M2","type":"mc","q":"What does the guiding principle 'optimize and automate' say about order?","options":["Improve the process first, then automate it","Automate first so problems become visible","Automate only new processes","Automation replaces optimization"],"correctIndex":0,"explain":"Automating a poor process only makes it faster.","source":"Book ch.6 (independent)"},{"id":"U024","module":"M2","type":"mc","q":"A programme is split into small releases and feedback is collected from users after each one. Which principle is applied?","options":["Progress iteratively with feedback","Start where you are","Keep it simple and practical","Focus on value"],"correctIndex":0,"explain":"Small steps plus feedback is the iterative principle.","source":"Book ch.6 (independent)"},{"id":"U025","module":"M2","type":"mc","q":"Before buying a new tool, a team reviews which existing processes and tools already work. Which principle is applied?","options":["Start where you are","Think and work holistically","Collaborate and promote visibility","Optimize and automate"],"correctIndex":0,"explain":"Assess the current state and reuse what works.","source":"Book ch.6 (independent)"},{"id":"U026","module":"M2","type":"mc","q":"A new tool also needs new skills, supplier changes and revised workflows, so all of these are planned together. Which principle is applied?","options":["Think and work holistically","Keep it simple and practical","Progress iteratively with feedback","Focus on value"],"correctIndex":0,"explain":"It links to the four dimensions: consider the whole system.","source":"Book ch.6 (independent)"},{"id":"U027","module":"M2","type":"mc","q":"Shared dashboards and cross-team planning illustrate which principle?","options":["Collaborate and promote visibility","Start where you are","Optimize and automate","Think and work holistically"],"correctIndex":0,"explain":"Work across boundaries and share information openly.","source":"Book ch.6 (independent)"},{"id":"U028","module":"M2","type":"neg","q":"Which is NOT one of the seven guiding principles?","options":["Measure individual performance closely","Focus on value","Keep it simple and practical","Think and work holistically"],"correctIndex":0,"explain":"The seven: focus on value; start where you are; progress iteratively with feedback; collaborate and promote visibility; think and work holistically; keep it simple and practical; optimize and automate.","source":"Book ch.6 (independent)"},{"id":"U029","module":"M2","type":"mc","q":"An organization notices that predictive analytics could improve reliability, though nobody has asked for it. What is this?","options":["An opportunity","A demand","A service request","An outcome"],"correctIndex":0,"explain":"Opportunities are possible improvements before any formal demand exists. Demand is an expressed need.","source":"Book ch.6 (independent)"},{"id":"U030","module":"M2","type":"mc","q":"What is the relationship between governance and management?","options":["Governance directs and oversees; management carries out the work","Governance carries out the work; management directs it","They are the same activity","Management sets policy; governance operates the service"],"correctIndex":0,"explain":"Governance sets direction and accountability; management executes.","source":"Book ch.6 (independent)"},{"id":"U031","module":"M2","type":"gap","q":"The ITIL guiding principles are universal recommendations that apply to ______.","options":["any organization and any situation","only IT departments","only large enterprises","only service providers"],"correctIndex":0,"explain":"They are universal and used together, not one at a time.","source":"Book ch.6 (independent)"},{"id":"U032","module":"M3","type":"mc","q":"How does a value stream differ from the value chain?","options":["A value stream is one specific workflow built from the value chain's activities","A value stream replaces management practices","A value stream is the set of governance activities","The value stream is the generic set; the chain is one workflow"],"correctIndex":0,"explain":"The chain is the generic set of activities; a stream combines them for a specific purpose.","source":"Book ch.7, App. A (independent)"},{"id":"U033","module":"M3","type":"mc","q":"Are the value chain activities a fixed sequence?","options":["No: they can run in parallel, repeat and change order","Yes: always from discover through support","Yes: but only inside the value stream","No: they run only once per product"],"correctIndex":0,"explain":"The activities interact through inputs, outputs and feedback loops.","source":"Book ch.7, App. A (independent)"},{"id":"U034","module":"M3","type":"mc","q":"Into which two groups are management practices organized in ITIL 5?","options":["General management practices and product and service management practices","Technical and service management practices","Strategic and operational practices","Incident and change practices"],"correctIndex":0,"explain":"ITIL 4 had three groups; ITIL 5 uses two.","source":"Book ch.7, App. A (independent)"},{"id":"U035","module":"M3","type":"mc","q":"Which statement describes a critical success factor (CSF)?","options":["A necessary condition for success","A measurement that is monitored and reported","A written agreement with a supplier","A step in the improvement model"],"correctIndex":0,"explain":"A CSF states what must be achieved. Metrics measure whether it is.","source":"Book ch.7, App. A (independent)"},{"id":"U036","module":"M3","type":"mc","q":"Which statement describes a metric?","options":["A measurement or calculation that is monitored and reported","A necessary condition for success","A governance policy","A type of value stream"],"correctIndex":0,"explain":"CSF first, then metrics to check it.","source":"Book ch.7, App. A (independent)"},{"id":"U037","module":"M3","type":"mc","q":"In the Continual Improvement Model, which question comes second?","options":["Where are we now?","What is the vision?","How do we get there?","Take action"],"correctIndex":0,"explain":"Vision, where are we now, where do we want to be, how do we get there, take action, are we getting there, keep improvements relevant.","source":"Book ch.7, App. A (independent)"},{"id":"U038","module":"M3","type":"neg","q":"Which is NOT a step in the Continual Improvement Model?","options":["Who is responsible?","What is the vision?","Are we getting there?","Where do we want to be?"],"correctIndex":0,"explain":"The seven steps are questions about vision, current state, target, plan, action, progress and sustaining.","source":"Book ch.7, App. A (independent)"},{"id":"U039","module":"M3","type":"mc","q":"How many chapters does each ITIL practice guide have?","options":["Seven","Four","Five","Ten"],"correctIndex":0,"explain":"General information; value streams and processes; organizations and people; information and technology; partners and suppliers; capability assessment and development; recommendations for success.","source":"Book ch.7, App. A (independent)"},{"id":"U040","module":"M3","type":"list","q":"Which TWO are product and service management practices?\n1. Incident management\n2. Strategy management\n3. Service desk\n4. Portfolio management","options":["1 and 2","1 and 3","1 and 4","2 and 3"],"correctIndex":1,"explain":"Strategy and portfolio management are general management practices.","source":"Book ch.7, App. A (independent)"},{"id":"U041","module":"M3","type":"mc","q":"Which statement separates an incident from a problem?","options":["An incident is an unplanned interruption; a problem is a cause or potential cause of incidents","An incident is a cause; a problem is an interruption","They are the same","An incident is planned; a problem is unplanned"],"correctIndex":0,"explain":"Problem management works on causes so incidents happen less and hurt less.","source":"Book ch.7, App. A (independent)"},{"id":"U042","module":"M3","type":"mc","q":"Which statement separates an event from an incident?","options":["An event is any significant change of state; an incident is an unplanned interruption or quality drop","An event is an interruption; an incident is a change of state","They are the same","An event is always an error"],"correctIndex":0,"explain":"Not every event is an incident.","source":"Book ch.7, App. A (independent)"},{"id":"U043","module":"M3","type":"mc","q":"What does continuous integration do?","options":["Developers frequently merge code into a central repository, followed by automated builds and tests","It deploys every change to production automatically at once","It records incidents in a central log","It merges two practices into one"],"correctIndex":0,"explain":"CI is about frequent merging with automated build and test.","source":"Book ch.7, App. A (independent)"},{"id":"U044","module":"M3","type":"mc","q":"Which term describes an early version used to demonstrate form, function and operation before full development?","options":["Product prototype","Product specification","Release","Known error"],"correctIndex":0,"explain":"A specification is the written description; a prototype is an early working version.","source":"Book ch.7, App. A (independent)"},{"id":"U045","module":"M3","type":"mc","q":"Reliability is best described as:","options":["The ability to perform the intended function for a specified period of time or number of cycles","The cost of running a service","The number of incidents closed","The speed of a release"],"correctIndex":0,"explain":"SRE applies software engineering to build scalable, highly reliable systems.","source":"Book ch.7, App. A (independent)"},{"id":"U046","module":"M4","type":"mc","q":"Which practice has the purpose of minimizing the negative impact of incidents by restoring normal service as quickly as possible?","options":["Incident management","Problem management","Change enablement","Service request management"],"correctIndex":0,"explain":"Incident management restores service; problem management works on causes.","source":"Book App. B (independent)"},{"id":"U047","module":"M4","type":"mc","q":"Which practice reduces the likelihood and impact of incidents by identifying actual and potential causes and managing workarounds and known errors?","options":["Problem management","Incident management","Availability management","Monitoring and event management"],"correctIndex":0,"explain":"Problem management targets causes.","source":"Book App. B (independent)"},{"id":"U048","module":"M4","type":"mc","q":"Which practice assesses risks, authorizes changes and manages a change schedule to maximize successful changes?","options":["Change enablement","Release management","Deployment management","Knowledge management"],"correctIndex":0,"explain":"Change enablement controls the risk of changes.","source":"Book App. B (independent)"},{"id":"U049","module":"M4","type":"mc","q":"Which practice systematically observes services and components and records and reports selected changes of state as events?","options":["Monitoring and event management","Incident management","Capacity and performance management","Measurement and reporting"],"correctIndex":0,"explain":"Events are significant changes of state.","source":"Book App. B (independent)"},{"id":"U050","module":"M4","type":"mc","q":"Which practice ensures that services deliver agreed levels of availability?","options":["Availability management","Capacity and performance management","Service continuity management","Problem management"],"correctIndex":0,"explain":"Availability management focuses on agreed availability levels.","source":"Book App. B (independent)"},{"id":"U051","module":"M4","type":"mc","q":"Which practice manages the human aspects of change so that changes in the organization are implemented smoothly and benefits last?","options":["Organizational change management","Change enablement","Project management","Knowledge management"],"correctIndex":0,"explain":"Organizational change management addresses people, not technical risk.","source":"Book App. B (independent)"},{"id":"U052","module":"M4","type":"mc","q":"Which statement describes a management practice?","options":["An organizational capability for a type of work, combining processes, roles, tools and skills","A single fixed process with no roles","A report format for governance","A supplier contract"],"correctIndex":0,"explain":"A practice is broader than a process.","source":"Book App. B (independent)"},{"id":"U053","module":"M4","type":"mc","q":"Which activity most directly depends on the incident management and problem management practices?","options":["Support","Discover","Design","Acquire"],"correctIndex":0,"explain":"Support responds to user needs, incidents and problems.","source":"Book App. B (independent)"},{"id":"U054","module":"M5","type":"neg","q":"Which is NOT one of the four dimensions?","options":["Governance and strategy","Organizations and people","Information and technology","Partners and suppliers"],"correctIndex":0,"explain":"The four: organizations and people; information and technology; partners and suppliers; value streams and processes.","source":"Book ch.3, ch.5 (independent)"},{"id":"U055","module":"M5","type":"mc","q":"A company introduces an AI tool. It also needs new skills and revised workflows. Why should all four dimensions be considered together?","options":["A change in one dimension usually affects the others","Each dimension must be changed in the same month","Only information and technology matter for AI","Governance requires all four to be audited"],"correctIndex":0,"explain":"The holistic approach avoids siloed decisions.","source":"Book ch.3, ch.5 (independent)"},{"id":"U056","module":"M5","type":"list","q":"Which TWO are external factors in PESTLE?\n1. Legal\n2. Value streams\n3. Environmental\n4. Suppliers","options":["1 and 2","1 and 3","1 and 4","2 and 3"],"correctIndex":1,"explain":"PESTLE: political, economic, social, technological, legal, environmental.","source":"Book ch.3, ch.5 (independent)"},{"id":"U057","module":"M5","type":"mc","q":"What does the L in PESTLE stand for?","options":["Legal","Leadership","Lifecycle","Logistics"],"correctIndex":0,"explain":"Political, economic, social, technological, legal, environmental.","source":"Book ch.3, ch.5 (independent)"},{"id":"U058","module":"M5","type":"mc","q":"Which lifecycle activity moves new or changed products and services into controlled environments through release, testing and deployment?","options":["Transition","Build","Deliver","Operate"],"correctIndex":0,"explain":"Transition covers release, testing and deployment.","source":"Book ch.3, ch.5 (independent)"},{"id":"U059","module":"M5","type":"mc","q":"Which lifecycle activity identifies needs, opportunities, demand and possible value before anything is designed or changed?","options":["Discover","Design","Acquire","Support"],"correctIndex":0,"explain":"Discover comes first in the list and feeds design.","source":"Book ch.3, ch.5 (independent)"},{"id":"U060","module":"M5","type":"mc","q":"Which lifecycle activity obtains resources, components or supplier capabilities from outside?","options":["Acquire","Build","Transition","Deliver"],"correctIndex":0,"explain":"Acquire sources; build creates and integrates.","source":"Book ch.3, ch.5 (independent)"},{"id":"U061","module":"M5","type":"mc","q":"Which lifecycle activity responds to user needs, incidents, problems and resilience issues?","options":["Support","Operate","Deliver","Discover"],"correctIndex":0,"explain":"Operate keeps it running; deliver makes it available for outcomes; support responds.","source":"Book ch.3, ch.5 (independent)"},{"id":"U062","module":"M5","type":"mc","q":"Which statement about the lifecycle activities is correct?","options":["They are iterative and not always linear","They must run once, in order","They apply only to new products","Each activity must finish before the next starts"],"correctIndex":0,"explain":"Insights from operating can send you back to discover and design.","source":"Book ch.3, ch.5 (independent)"},{"id":"U063","module":"M5","type":"mc","q":"Which is raw facts without context?","options":["Data","Information","Knowledge","Insight"],"correctIndex":0,"explain":"Data, then information (with context), then knowledge (with experience and analysis).","source":"Book ch.3, ch.5 (independent)"},{"id":"U064","module":"M5","type":"mc","q":"In which context can cause and effect only be understood afterwards?","options":["Complex","Ordered","Chaotic","Confused"],"correctIndex":0,"explain":"Ordered: known or knowable. Chaotic: crisis. Confused: not yet understood.","source":"Book ch.3, ch.5 (independent)"},{"id":"U065","module":"M5","type":"mc","q":"An organization uses its own staff together with an external partner to deliver a service. Which sourcing model is this?","options":["Co-sourcing","Insourcing","Outsourcing","Cloud-based sourcing"],"correctIndex":0,"explain":"Insourcing is internal; outsourcing is external; co-sourcing combines them.","source":"Book ch.3, ch.5 (independent)"},{"id":"U066","module":"M6","type":"mc","q":"Which statement describes an enabling value stream?","options":["It supports the core value streams by serving internal customers","It delivers value directly to external consumers","It replaces the value chain","It is the same as a management practice"],"correctIndex":0,"explain":"Examples: supplier onboarding, infrastructure provisioning, knowledge management.","source":"Book ch.8, ch.9, App. A (independent)"},{"id":"U067","module":"M6","type":"mc","q":"Which statement describes a core value stream?","options":["It delivers value to consumers in the form the operating model intends","It supports internal customers only","It is a type of governance activity","It is a group of practices"],"correctIndex":0,"explain":"Core streams are the main way products and services reach customers.","source":"Book ch.8, ch.9, App. A (independent)"},{"id":"U068","module":"M6","type":"mc","q":"What is value stream mapping used for?","options":["Visualizing steps, flow, dependencies and delays to find bottlenecks and waste","Assigning budget to practices","Recording incidents","Measuring customer satisfaction only"],"correctIndex":0,"explain":"It is a diagnostic and decision-support tool.","source":"Book ch.8, ch.9, App. A (independent)"},{"id":"U069","module":"M6","type":"mc","q":"Which is the correct order of the mapping stages?","options":["Identify, map as-is, analyze, map to-be, plan and implement improvements","Map to-be, identify, analyze, map as-is, implement","Analyze, identify, implement, map as-is, map to-be","Identify, implement, analyze, map as-is, map to-be"],"correctIndex":0,"explain":"You must understand the current state before designing the future one.","source":"Book ch.8, ch.9, App. A (independent)"},{"id":"U070","module":"M6","type":"mc","q":"Which best describes generative AI (GenAI)?","options":["AI that creates new content such as text, images or code from patterns learned from existing data","AI that only classifies existing records","Software that runs scheduled batch jobs","Any system that follows fixed rules"],"correctIndex":0,"explain":"GenAI creates new content.","source":"Book ch.8, ch.9, App. A (independent)"},{"id":"U071","module":"M6","type":"mc","q":"Which best describes agentic AI?","options":["AI that acts on a user's behalf, performing predefined tasks within agreed boundaries under human oversight","AI that has no human oversight","AI that only answers questions","AI that replaces governance"],"correctIndex":0,"explain":"Agentic AI acts autonomously inside boundaries and remains subject to oversight and governance.","source":"Book ch.8, ch.9, App. A (independent)"},{"id":"U072","module":"M6","type":"mc","q":"What does AI governance ensure?","options":["AI is directed, controlled and monitored so AI-enabled products create value while staying ethical, secure and compliant","AI replaces human decision-making","AI is used only in operations","AI is free of any risk"],"correctIndex":0,"explain":"It extends governance to AI, including accountability and control of risks like bias.","source":"Book ch.8, ch.9, App. A (independent)"},{"id":"U073","module":"M6","type":"neg","q":"Which is NOT one of the six Cs of the ITIL AI Capability Model?","options":["Control","Creation","Cognition","Curation"],"correctIndex":0,"explain":"Creation, coordination, communication, cognition, clarification, curation.","source":"Book ch.8, ch.9, App. A (independent)"},{"id":"U074","module":"M6","type":"mc","q":"In the 6C model, which capability helps people find, understand, summarize or translate existing content?","options":["Clarification","Creation","Coordination","Curation"],"correctIndex":0,"explain":"Creation makes new outputs; clarification helps with existing content; curation improves its quality and organization.","source":"Book ch.8, ch.9, App. A (independent)"},{"id":"U075","module":"M6","type":"mc","q":"Capability versus maturity: which is correct?","options":["Capability applies to one practice; maturity applies to how well the whole system is governed, measured and improved","Capability applies to the whole system; maturity to one practice","They are the same measure","Maturity applies only to suppliers"],"correctIndex":0,"explain":"The ITIL maturity model separates practice capability from system maturity.","source":"Book ch.8, ch.9, App. A (independent)"},{"id":"U076","module":"M6","type":"mc","q":"What is an operating model?","options":["A representation of how an organization co-creates value with customers and stakeholders and runs itself","A list of governance policies","A schedule of releases","A set of service level targets"],"correctIndex":0,"explain":"It links purpose to execution.","source":"Book ch.8, ch.9, App. A (independent)"},{"id":"U077","module":"M6","type":"mc","q":"How many chapters mirror the four dimensions in a practice guide?","options":["Four (chapters 2 to 5)","One","Two","Seven"],"correctIndex":0,"explain":"Value streams and processes; organizations and people; information and technology; partners and suppliers.","source":"Book ch.8, ch.9, App. A (independent)"},{"id":"U078","module":"M3","type":"mc","q":"Which term describes a flaw or vulnerability that may cause incidents?","options":["Error","Known error","Event","Release"],"correctIndex":0,"explain":"An error is a flaw or vulnerability that may cause incidents. A problem is a cause, or potential cause, of incidents.","source":"ITIL (Version 5) Master Glossary (official)"},{"id":"U079","module":"M3","type":"mc","q":"What is a known error?","options":["A problem that has been analysed but is not yet resolved","An incident that has been closed","A flaw that has never caused an incident","A problem with a mandatory permanent fix"],"correctIndex":0,"explain":"A workaround can reduce impact but is not part of the definition.","source":"ITIL (Version 5) Master Glossary (official)"},{"id":"U080","module":"M3","type":"mc","q":"An engineer says the same fault will keep causing outages until it is fixed, and the cause is understood but the fix is not yet applied. Which term fits?","options":["Known error","Event","Release","Disaster"],"correctIndex":0,"explain":"A known error is an analysed problem that remains unresolved.","source":"Online: open-exam-prep ITIL V5 guide (independent)"},{"id":"U081","module":"M3","type":"mc","q":"What is a disaster in ITIL terms?","options":["A sudden, unplanned event that causes great damage or serious loss, so critical business functions can't be provided for a predetermined minimum period","Any incident that lasts longer than one day","A change that was not authorized","A failed release"],"correctIndex":0,"explain":"The glossary describes a disaster by its severity and by the loss of critical business functions.","source":"ITIL (Version 5) Master Glossary (official)"},{"id":"U082","module":"M3","type":"mc","q":"What is observability?","options":["The ability to understand the internal state of a complicated system by analysing its external outputs such as metrics, logs and traces","A dashboard showing uptime","A service level target","A type of governance report"],"correctIndex":0,"explain":"It is about understanding a system from its outputs, not just displaying a dashboard.","source":"ITIL (Version 5) Master Glossary (official)"},{"id":"U083","module":"M3","type":"mc","q":"What does a test do?","options":["Checks an aspect of a product, service or component against requirements or expectations","Moves a component into the live environment","Describes the properties of a product","Authorizes a change"],"correctIndex":0,"explain":"Testing can happen repeatedly through development and transition.","source":"Online: open-exam-prep ITIL V5 guide (independent)"},{"id":"U084","module":"M3","type":"mc","q":"What is the difference between continuous delivery and continuous deployment?","options":["Delivery lets updates be deployed at any time but a deployment decision is still taken; deployment releases every change that passes automated tests automatically","Delivery is for hardware; deployment is for software","Delivery has no testing; deployment has testing","They are the same practice"],"correctIndex":0,"explain":"Continuous deployment removes the extra authorization and relies on continuous delivery.","source":"ITIL (Version 5) Master Glossary (official)"},{"id":"U085","module":"M3","type":"mc","q":"Which wording is used for step 6 of the Continual Improvement Model in the online ITIL 5 guide?","options":["Did we get there?","Who approved the change?","Take action","What is the vision?"],"correctIndex":0,"explain":"Step 6 checks results against targets. The book words it 'Are we getting there?'. Confirm in the official syllabus.","source":"Online: open-exam-prep ITIL V5 guide (independent)"},{"id":"U086","module":"M3","type":"mc","q":"How does the improvement model finish in the online ITIL 5 guide?","options":["How do we keep the momentum going? (and it loops back to step 1)","Where are we now?","Close the project","Who is accountable?"],"correctIndex":0,"explain":"The last step embeds the change and keeps improving, so the model is iterative.","source":"Online: open-exam-prep ITIL V5 guide (independent)"},{"id":"U087","module":"M6","type":"mc","q":"How does ITIL relate to DevOps?","options":["It complements it: DevOps adds speed and flow; ITIL adds service management structure, governance and a focus on value","It replaces it","It competes with it","It is limited to projects"],"correctIndex":0,"explain":"ITIL and DevOps are used together.","source":"Online: open-exam-prep ITIL V5 guide (independent)"},{"id":"U088","module":"M6","type":"mc","q":"What does PRINCE2 add alongside ITIL?","options":["Structured governance of finite projects with defined roles, stages and controls","Continuous deployment pipelines","Incident classification rules","The 6C AI model"],"correctIndex":0,"explain":"PRINCE2 runs the project; ITIL then runs and improves the result across the lifecycle.","source":"Online: open-exam-prep ITIL V5 guide (independent)"},{"id":"U089","module":"M6","type":"mc","q":"Which is an example of AI supporting the lifecycle and value chain?","options":["Triaging and categorizing incidents and predicting problems before outages","Replacing every human role in the service desk","Removing the need for governance","Setting the organization's mission"],"correctIndex":0,"explain":"AI augments human work under governance and oversight.","source":"Online: open-exam-prep ITIL V5 guide (independent)"},{"id":"U090","module":"M1","type":"mc","q":"Which organization designs, builds, operates and supports a service for consumers?","options":["The service provider","The service consumer","The sponsor","The digital product vendor only"],"correctIndex":0,"explain":"The provider is responsible for delivering and supporting services. It can be internal or external.","source":"Book ch.4, ch.7, ch.8, ch.9, App. B (independent)"},{"id":"U091","module":"M1","type":"mc","q":"Which statement about the service consumer is correct?","options":["It is a collective term: customers, users and sponsors sit inside the consumer organization","It is another name for the service provider","It only means the people who pay","It excludes anyone who uses the service"],"correctIndex":0,"explain":"The consumer organization contains the customer, user and sponsor roles.","source":"Book ch.4, ch.7, ch.8, ch.9, App. B (independent)"},{"id":"U092","module":"M1","type":"mc","q":"What does a digital product vendor do?","options":["Creates and continually improves digital products and related service offerings","Authorizes the budget for service consumption","Defines the requirements for a service","Uses the service day to day"],"correctIndex":0,"explain":"The vendor builds the products that services are based on.","source":"Book ch.4, ch.7, ch.8, ch.9, App. B (independent)"},{"id":"U093","module":"M3","type":"mc","q":"Which kind of measure best suits the Support activity?","options":["Incident resolution time","Development productivity","Release frequency","Requirements quality"],"correctIndex":0,"explain":"Operate, deliver and support are judged by stability and service performance.","source":"Book ch.4, ch.7, ch.8, ch.9, App. B (independent)"},{"id":"U094","module":"M3","type":"mc","q":"Release frequency and deployment success rate are typical measures for which activities?","options":["Design and transition","Discover","Acquire and build","Support"],"correctIndex":0,"explain":"They show the quality and control of what is designed and released.","source":"Book ch.4, ch.7, ch.8, ch.9, App. B (independent)"},{"id":"U095","module":"M6","type":"mc","q":"In a complex system, why should workflow optimization focus on end-to-end flow rather than single activities?","options":["Improving one activity does not guarantee a better outcome, because results come from the interactions across the system","Single activities are never worth improving","Flow is easier to measure than activities","Standardizing every step guarantees the best outcome"],"correctIndex":0,"explain":"Local optimization can hurt other parts of the value stream.","source":"Book ch.4, ch.7, ch.8, ch.9, App. B (independent)"},{"id":"U096","module":"M6","type":"mc","q":"Which approach to standardization does ITIL 5 recommend for complex workflows?","options":["Standardize where stability is needed and allow flexibility where variation is expected","Standardize every step","Avoid standardization entirely","Standardize only the final step"],"correctIndex":0,"explain":"Rigid control can reduce adaptability.","source":"Book ch.4, ch.7, ch.8, ch.9, App. B (independent)"},{"id":"U097","module":"M6","type":"mc","q":"What is the purpose of AI in digital product and service management?","options":["To help create and run products and services better and faster, augmenting people under governance","To replace every human role","To remove the need for governance","To set the organization's strategy"],"correctIndex":0,"explain":"AI enables automation and insight, and still needs governance and human oversight.","source":"Book ch.4, ch.7, ch.8, ch.9, App. B (independent)"},{"id":"U098","module":"M6","type":"mc","q":"Why is project management important in ITIL?","options":["It structures finite work such as transformations, migrations and builds with roles, stages and controls","It replaces the product and service lifecycle","It only applies to incident handling","It removes the need for continual improvement"],"correctIndex":0,"explain":"The project delivers the change; ITIL then runs and improves the result.","source":"Book ch.4, ch.7, ch.8, ch.9, App. B (independent)"}]};

var PFILE="progress.json",pmsg="",pbusy=false,ptimer=null,inP=false,TSNAP={};
function termSig(t){return JSON.stringify(TERM_KEEP.filter(function(k){return k!=="u"}).map(function(k){return t[k]}))}
function stampTerms(){S.terms.forEach(function(t){var j=termSig(t);if(TSNAP[t.id]===undefined)TSNAP[t.id]=j;else if(TSNAP[t.id]!==j){t.u=Date.now();TSNAP[t.id]=j}})}
function snapTerms(){S.terms.forEach(function(t){TSNAP[t.id]=termSig(t)})}
function pschedule(){var c=syncCfg();if(!c.token||!c.repo||c.progress===false)return;clearTimeout(ptimer);ptimer=setTimeout(function(){syncProgress()},6000)}
function pexport(){return{v:1,ts:Date.now(),modules:S.modules.map(function(m){return{id:m.id,quizzes:m.quizzes||[],manual:m.manual||{}}}),terms:S.terms.map(function(t){var o={id:t.id};TERM_KEEP.forEach(function(k){o[k]=t[k]});return o}),log:S.log,lp:S.lp||{},up:S.up||{}}}
function pcanon(o){var c=JSON.parse(JSON.stringify(o));delete c.ts;return JSON.stringify(c)}
function pkey(x){return x&&x.ts?x.ts:(x&&Date.parse(x.date))||0}
function uni(a,b){var seen={},o=[];(a||[]).concat(b||[]).forEach(function(x){var k=JSON.stringify(x);if(!seen[k]){seen[k]=1;o.push(x)}});return o}
function sortc(a){return a.map(function(x,i){return[x,i]}).sort(function(p,q){return pkey(p[0])-pkey(q[0])||p[1]-q[1]}).map(function(p){return p[0]})}
function mergeRemote(r){if(!r||(r.v!==1&&r.version!==2))return;
 ["sessions","gate","errors","workApps","feynman","reviews","sims"].forEach(function(k){S.log[k]=sortc(uni(S.log[k],r.log&&r.log[k]))});
 var rb=r.log&&r.log.baseline;if(rb&&(!S.log.baseline||(rb.ts||0)>(S.log.baseline.ts||0)))S.log.baseline=rb;
 (r.modules||[]).forEach(function(rm){var m=M(rm.id);if(!m)return;m.quizzes=sortc(uni(m.quizzes,rm.quizzes));m.manual=m.manual||{};Object.keys(rm.manual||{}).forEach(function(k){if(rm.manual[k])m.manual[k]=true})});
 (r.terms||[]).forEach(function(rt){var t=T(rt.id);if(!t)return;if((rt.u||0)>(t.u||0))TERM_KEEP.forEach(function(k){if(rt[k]!=null)t[k]=rt[k]})});
 S.lp=S.lp||{};Object.keys(r.lp||{}).forEach(function(id){var a=lp(id),b=r.lp[id]||{};a.read=Math.max(a.read||0,b.read||0);a.checks=sortc(uni(a.checks,b.checks))});
 S.up=S.up||{};Object.keys(r.up||{}).forEach(function(m){S.up[m]=sortc(uni(S.up[m],r.up[m]))})}
function b64(s){return btoa(unescape(encodeURIComponent(s)))}
function unb64(s){return decodeURIComponent(escape(atob(String(s).replace(/\s/g,""))))}
function syncProgress(retry){var c=syncCfg();if(!c.token||!c.repo||c.progress===false||pbusy||typeof fetch!=="function")return;pbusy=true;
 var url="https://api.github.com/repos/"+c.repo+"/contents/"+PFILE,h={Authorization:"Bearer "+c.token,Accept:"application/vnd.github+json"};
 function done(m){pbusy=false;pmsg=m;render()}
 fetch(url,{headers:h}).then(function(r){if(r.status===404)return null;if(!r.ok)throw new Error("read "+r.status);return r.json()})
 .then(function(f){var remote=null,sha=null;if(f){sha=f.sha;try{remote=JSON.parse(unb64(f.content))}catch(e){}}
  if(remote)mergeRemote(remote);
  snapTerms();inP=true;save();inP=false;
  var out=pexport();
  if(remote&&pcanon(remote)===pcanon(out)){done("Progress up to date ("+new Date().toLocaleTimeString()+").");return}
  var body={message:"Update progress",content:b64(JSON.stringify(out))};if(sha)body.sha=sha;
  return fetch(url,{method:"PUT",headers:{Authorization:"Bearer "+c.token,Accept:"application/vnd.github+json","Content-Type":"application/json"},body:JSON.stringify(body)})
   .then(function(r){if(r.ok){done("Progress synced ("+new Date().toLocaleTimeString()+").");return}
    if((r.status===409||r.status===422)&&!retry){pbusy=false;syncProgress(true);return}
    if(r.status===403||r.status===404){done("Progress not saved: the token needs Read and write access to Contents.");return}
    throw new Error("write "+r.status)})})
 .catch(function(e){done("Progress sync failed ("+(e&&e.message||"error")+"). It will retry.")})}

 L.push("","### Errors");S.log.errors.forEach(function(e){L.push("- "+e.date+" | "+e.q+" | "+e.a+" | "+(e.why||"")+" | "+(e.confusable||""))});
 L.push("","### Feynman cards");S.log.feynman.forEach(function(f){L.push("- "+f.date+" "+f.term+" ("+f.result+"): "+f.simple+(f.analogy?" Analogy: "+f.analogy:"")+(f.example?" Example: "+f.example:""))});
 L.push("","### Work Applications","","| date | label | place | principle | dimensions | improve |","|---|---|---|---|---|---|");
 S.log.workApps.forEach(function(w){L.push("| "+[w.date,(w.label?w.label+": ":"")+(w.what||""),(w.place||"")+(w.stream?" / "+w.stream:""),w.principle||"",(w.dims||[]).join("; "),w.improve||""].map(function(x){return String(x).replace(/\|/g,"/").replace(/\n/g," ")}).join(" | ")+" |")});
 L.push("","### Sessions");S.log.sessions.forEach(function(s){L.push("- "+s.date+" "+Math.round(s.sec/60)+" min"+(s.win?": "+s.win:""))});
 return L.join("\n")}
function vExport(){
 var bk=JSON.stringify({version:2,modules:S.modules.map(function(m){return{id:m.id,quizzes:m.quizzes,manual:m.manual}}),terms:S.terms.map(function(t){var o={id:t.id};TERM_KEEP.forEach(function(k){o[k]=t[k]});return o}),log:S.log,lp:S.lp||{},up:S.up||{}});
 return '<h1>Backup</h1><div class="sub">Your progress lives only on this device. Use this tab to copy it to another device or keep a backup.</div><div class="card"><h2>Notes export</h2><div class="mut">A readable summary you can paste into any notes app.</div><textarea id="ex" rows="10" readonly>'+esc(exportMd())+'</textarea><button class="w" data-a="copy" data-v="ex" style="margin-top:8px">Copy</button><div id="cpm" class="mut">'+esc(msg)+'</div></div>'+
 '<div class="card"><h2>Move progress to another device (or back it up)</h2><div class="mut">Tap Copy backup. On the other device, open this tab, paste into the box under Merge progress and tap Merge. Progress from both devices is combined and nothing is lost. You can also paste the copy into a notes app as a backup. '+(S.lastBackup?'Last copied: '+new Date(S.lastBackup).toLocaleDateString()+'.':'')+'</div><textarea id="bk" rows="5" readonly>'+esc(bk)+'</textarea><button class="w g" data-a="copy" data-v="bk" style="margin-top:8px">Copy backup</button></div>'+
 importCard()+'<div class="card"><h2>Merge progress</h2><textarea id="imp" rows="4" placeholder="Paste progress from your other device here"></textarea><button class="w" data-a="import" style="margin-top:8px">Merge</button></div><div class="mut" style="text-align:center;margin:8px 0 16px">Version built '+esc(SEED.build||"")+'. Stored on this device only.</div>'}

function render(){nav();var v={today:vToday,learn:vLearn,session:vSession,quiz:vQuiz,cards:vCards,work:vWork,"export":vExport}[tab];$("#app").innerHTML=v()}

/* ---------- actions ---------- */
function go(t){tab=t;render();window.scrollTo(0,0)}
document.addEventListener("change",function(e){var el=e.target;if(el.dataset.a==="manual"){M(el.dataset.m).manual[el.dataset.v]=el.checked;save();render()}else if(el.dataset.a==="cmod"){S.cardMod=el.value;render()}else if(el.dataset.a==="lfile"&&el.files&&el.files[0]){var fr=new FileReader();fr.onload=function(){try{msg="Loaded "+importLessons(String(fr.result))+" lessons."}catch(x){msg="Could not load: not a valid lessons file."}render()};fr.readAsText(el.files[0])}});
document.addEventListener("click",function(e){var el=e.target.closest("[data-a]");if(!el||el.tagName==="SELECT"||el.type==="checkbox"||el.type==="file")return;e.preventDefault();var a=el.dataset.a,v=el.dataset.v;
 try{act(a,v)}catch(err){console.warn(err)}});
function act(a,v){
 if(a==="tab"){if(v!=="cards"){sel=null}tab=v;msg="";render();return}
 if(a==="gonext"){var cm=currentModule(),nx=crit(cm).filter(function(x){return !x.met})[0];
  if(nx&&nx.key==="uq"){tab="quiz";quiz=null;render();return}
  if(nx&&nx.key==="lessons"){var nl=nextLesson(cm.id);tab="learn";lsel=nl?nl.id:null;lchk=null;render();window.scrollTo(0,0);return}
  if(cm.id==="M0"&&nx&&nx.key==="base"){tab="quiz";quiz=null}else if(nx&&nx.key==="quiz"){tab="quiz";quiz=null}else if(nx&&nx.key==="terms"){tab="cards";S.cardMod=cm.id;var lw=modTerms(cm.id).filter(function(t){return t.rung<(t.core?3:2)})[0];sel=lw?lw.id:null}else if(nx&&nx.key==="work"||nx&&nx.key==="ev")tab="work";else tab="quiz";render();return}
 if(a==="syncsave"){syncSet({repo:val("srepo"),token:val("stok"),last:0});syncLessons();syncProgress();render();return}
 if(a==="trecall"){var tr=T(v);tr.rung=Math.max(tr.rung,2);if(!tr.nextReview){tr.nextReview=addDays(today(),INT[(tr.box||1)-1]);tr.queued=true}save();var mt2=modTerms(tr.module),nx=mt2.filter(function(x){return x.rung<2})[0];if(nx){sel=nx.id}else{sel=null}render();window.scrollTo(0,0);return}
 if(a==="guidehide"){S.seenGuide=true;save();render();return}
 if(a==="examsave"){var ed=val("exd");if(/^\d{4}-\d{2}-\d{2}$/.test(ed)){S.examDate=ed;save()}render();return}
 if(a==="examclear"){S.examDate="";save();render();return}
 if(a==="syncslink"){var cc=syncCfg();var ta=document.getElementById("slink");if(cc.token&&cc.repo&&ta){ta.value=location.origin+location.pathname+"#setup="+b64(JSON.stringify({repo:cc.repo,token:cc.token}));ta.select();try{document.execCommand("copy")}catch(e){}}else{syncMsg="Save the repository and token first."}render();return}
 if(a==="syncnow"){syncLessons();syncProgress();render();return}
 if(a==="uqstart"){startQuiz("uq",val("uqm")||"ALL");save();render();return}
 if(a==="qweak"){startQuiz("weak");save();render();return}
 if(a==="openlesson"){tab="learn";lsel=v;lchk=null;render();window.scrollTo(0,0);return}
 if(a==="lback"){lsel=null;lchk=null;render();window.scrollTo(0,0);return}
 if(a==="lread"){var q1=lp(v);if(!q1.read)q1.read=Date.now();save();render();return}
 if(a==="lstart"){lchk={id:v,i:0,show:false,right:0,done:false};render();return}
 if(a==="lshow"){lchk.show=true;render();return}
 if(a==="lyes"||a==="lno"){var ls=LESS.filter(function(x){return x.id===lchk.id})[0],sp2=splitLesson(ls.md);
  if(a==="lyes")lchk.right++;else addError("Lesson: "+ls.title+" - "+sp2.qs[lchk.i],sp2.as[lchk.i]||"","","");
  lchk.i++;lchk.show=false;
  if(lchk.i>=sp2.qs.length){lp(ls.id).checks.push({ts:Date.now(),right:lchk.right,total:sp2.qs.length});lchk.done=true}
  save();render();return}
 if(a==="lterms"){tab="cards";S.cardMod=v;sel=null;fey=null;rev=null;render();window.scrollTo(0,0);return}
 if(a==="lquiz"){tab="quiz";quiz=null;render();window.scrollTo(0,0);return}
 if(a==="limport"){try{var n=importLessons(val("lpaste"));msg="Loaded "+n+" lessons."}catch(x){msg="Could not load: not a valid lessons file."}render();return}
 if(a==="openterm"){tab="cards";sel=v;fey=null;rev=null;render();window.scrollTo(0,0);return}
 if(a==="back"){sel=null;render();return}
 if(a==="sstart"){sess={t0:Date.now(),extra:0};save();render();return}
 if(a==="smore"){sess.extra+=600;render();return}
 if(a==="sfin"){var w=val("win"),sec=Math.floor((Date.now()-sess.t0)/1000);S.log.sessions.push({date:today(),sec:sec,win:w});sess=null;save();tab="today";render();return}
 if(a==="qstart"){if(v==="module")startQuiz("module",val("qm"));else startQuiz(v);save();render();return}
 if(a==="qpick"){qAnswer(+v);save();render();return}
 if(a==="qback"){if(quiz.i>0)quiz.i--;save();render();return}
 if(a==="qflag"){var fi=quiz.items[quiz.i];fi.flag=!fi.flag;save();render();return}
 if(a==="qjump"){quiz.i=+v;save();render();return}
 if(a==="qfinish"){finishQuiz();render();return}
 if(a==="qnext"){if(quiz.i+1>=quiz.items.length){finishQuiz()}else{quiz.i++;save()}render();return}
 if(a==="qdone"){quiz=null;render();return}
 if(a==="gateadd"){S.log.gate.push({date:today(),score:+v,src:val("gsrc")||"Focus app"});save();quiz=null;render();return}
 if(a==="gateman"){var sc=parseInt(val("gs"),10);if(isNaN(sc)||sc<0||sc>40||!val("gsrc2"))return;S.log.gate.push({date:today(),score:sc,src:val("gsrc2")});save();render();return}
 if(a==="startrev"){var q=dueQueue();if(!q.length)return;rev={ids:q.map(function(t){return t.id}),i:0,show:false,right:0};tab="cards";sel=null;fey=null;render();return}
 if(a==="revshow"){rev.show=true;render();return}
 if(a==="revyes"||a==="revno"){var t=T(rev.ids[rev.i]),ok=a==="revyes";
  if(ok){rev.right++;t.rung=Math.max(t.rung,2)}else addError("Review: "+t.name,"See "+t.sourceRef,"","");
  schedule(t,ok);S.log.reviews.push({date:today(),termId:t.id,ok:ok});save();rev.i++;rev.show=false;render();return}
 if(a==="revdone"){rev=null;render();return}
 if(a==="tsave"){var t2=T(v);t2.rung=+val("trung");t2.plainWords=val("tpw");t2.workExample=val("twe");t2.confusableWith=val("tcf");t2.examTrap=val("tet");save();render();return}
 if(a==="tqueue"){var t3=T(v);if(!t3.nextReview){t3.nextReview=today();save()}render();return}
 if(a==="fstart"){fey={tid:v,step:1};render();return}
 if(a==="fquit"){fey=null;render();return}
 if(a==="fnext"){var s=fey.step;
  if(s===2)fey.ex=val("fex");if(s===3)fey.gaps=val("fgap");
  if(s===4){fey.simple=val("fsim");fey.ana=val("fana");fey.exm=val("fexm");var t4=T(fey.tid);t4.plainWords=fey.simple||fey.ex||t4.plainWords;t4.workExample=fey.exm||t4.workExample;t4.analogy=fey.ana;t4.gaps=fey.gaps||"";save();fey.end=Date.now()+60000}
  fey.step++;render();return}
 if(a==="fpass"||a==="ffail"){var t5=T(fey.tid),ok2=a==="fpass";
  if(ok2){t5.rung=Math.max(t5.rung,3);t5.box=Math.max(t5.box||1,2);t5.nextReview=addDays(today(),INT[t5.box-1])}else{t5.box=1;t5.nextReview=addDays(today(),1)}
  S.log.feynman.push({date:today(),termId:t5.id,term:t5.name,result:ok2?"pass":"fail",explain:fey.ex||"",gaps:fey.gaps||"",simple:fey.simple||"",analogy:fey.ana||"",example:fey.exm||""});save();fey=null;render();return}
 if(a==="wsave"){var what=val("wwhat"),lab=val("wlab");if(!what&&!lab)return;
  var dims=$$(".wdim").filter(function(c){return c.checked}).map(function(c){return c.value});
  var e={date:today(),what:what,label:lab,place:val("wst"),stream:val("wvs"),principle:val("wpr"),dims:dims,pestle:val("wpe"),improve:val("wim"),module:val("wmod")};
  S.log.workApps.push(e);
  var tm=S.terms.filter(function(t){return t.name.toLowerCase()===lab.toLowerCase()})[0];
  if(tm){var full=e.place&&e.principle&&e.improve;tm.rung=Math.max(tm.rung,full?5:4)}
  save();render();return}
 if(a==="copy"){S.lastBackup=Date.now();save();var ta=document.getElementById(v);ta.select();var ok3=false;try{ok3=document.execCommand("copy")}catch(x){}
  if(!ok3&&navigator.clipboard)navigator.clipboard.writeText(ta.value).then(function(){var c=$("#cpm");if(c)c.textContent="Copied."});
  var c=$("#cpm");if(c)c.textContent=ok3?"Copied.":"Select the text and copy it manually.";return}
 if(a==="import"){try{var raw=JSON.parse(val("imp"));if(!raw||raw.version!==2||!raw.log)throw 0;mergeRemote(raw);snapTerms();save();msg="Merged. Nothing was overwritten.";render()}catch(x){msg="Merge failed: not a valid backup.";render()}return}
}
render();

if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(function(){});
syncLessons();
syncProgress();
