<title>Focus</title>
<style>
:root{--bg:#0f1115;--card:#181b22;--ink:#e8eaee;--mut:#8a90a0;--acc:#4f8cff;--ok:#3ecf8e;--bad:#ef5b5b;--line:#262a34}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,system-ui,sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto;padding:16px;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right));padding-top:max(16px,env(safe-area-inset-top))}
h1{font-size:20px;margin:4px 0 12px}h2{font-size:15px;margin:0 0 8px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.bar{height:12px;background:var(--line);border-radius:8px;overflow:hidden;margin:6px 0 2px}
.bar>i{display:block;height:100%;background:var(--acc);transition:width .4s}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.mut{color:var(--mut);font-size:13px}
button{background:var(--acc);color:#fff;border:0;border-radius:12px;padding:12px 16px;font-size:16px;font-weight:600;min-height:44px}
button.g{background:var(--line);color:var(--ink)}button.ok{background:var(--ok);color:#06210f}button.bad{background:var(--bad)}button.w{width:100%}
.opt{display:block;width:100%;text-align:left;margin:8px 0;background:var(--line);color:var(--ink);font-weight:500}
.opt.right{background:var(--ok);color:#06210f}.opt.wrong{background:var(--bad)}.opt.sel{outline:2px solid var(--acc)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#12151b;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border-radius:0;background:none;color:var(--mut);font-size:12px;padding:10px 2px}nav button.on{color:var(--acc)}
.t{font-size:54px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;margin:8px 0}
label.ck{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);min-height:44px}
input[type=checkbox]{width:22px;height:22px;flex:none}
input[type=number],input[type=text],select,textarea{background:var(--line);color:var(--ink);border:0;border-radius:10px;padding:10px;font-size:16px;width:100%;min-height:44px;margin:4px 0}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;background:var(--line);font-size:12px;color:var(--mut)}
.note{border-left:3px solid var(--acc);padding-left:10px;margin:8px 0}
.pre{white-space:pre-line}
.trow{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;background:none;color:var(--ink);border-bottom:1px solid var(--line);border-radius:0;font-weight:500;padding:10px 0}
details summary{min-height:44px;display:flex;align-items:center;cursor:pointer}
</style></head><body><main id="app"></main>
